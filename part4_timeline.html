function unitFormHtml({ title, name = '', min = 1, max = '', showQuick = true, gidSelect = null, curGid = null }) {
  return `
    <div class="inline-form" id="uForm">
      <div class="if-title">${title}</div>
      <div class="field" id="f_uname">
        <div class="field-label">預約單位名稱 <span class="err-msg" id="e_uname"></span></div>
        <div class="input"><input id="i_uname" maxlength="12" placeholder="如：1號桌" value="${esc(name)}"></div>
      </div>
      <div class="grid2">
        <div class="field" id="f_umin">
          <div class="field-label">最少容納人數</div>
          <div class="input"><input id="i_umin" type="number" min="1" value="${min}"></div>
        </div>
        <div class="field" id="f_umax">
          <div class="field-label">最多容納人數 <span class="err-msg" id="e_umax"></span></div>
          <div class="input"><input id="i_umax" type="number" min="1" value="${max}"></div>
        </div>
      </div>
      ${gidSelect ? `
      <div class="field"><div class="field-label">分類群組</div>
        <select class="sel" id="i_ugid">${gidSelect.map(g => `<option value="${g.id}" ${g.id === curGid ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select>
      </div>` : ''}
      ${showQuick ? `
      <div>
        <label class="check" id="ck_quick">
          <span class="box" id="bx_quick"></span>
          <span><span class="ck-label">快速新增</span>
          <div class="ck-desc">一次建立多個相同容納人數範圍的預約單位</div></span>
        </label>
        <div class="sub-field" id="sf_quick" style="margin-top:10px">
          <span class="sf-label">數量</span>
          <div class="input num-input"><input id="i_qty" type="number" min="2" value="2"></div>
        </div>
      </div>` : ''}
      <div class="btn-row">
        <button class="btn-md ghost" id="uCancel">取消</button>
        <button class="btn-md primary disabled" id="uSave">儲存</button>
      </div>
    </div>`;
}
function wireUnitForm({ onSave, onCancel }) {
  const iName = $('#i_uname'), iMin = $('#i_umin'), iMax = $('#i_umax'), save = $('#uSave');
  const bxQ = $('#bx_quick'), sfQ = $('#sf_quick');
  const upd = () => save.classList.toggle('disabled', !iName.value.trim() || !iMax.value);
  upd();
  [iName, iMin, iMax].forEach(i => i.addEventListener('input', () => {
    $('#f_uname').classList.remove('has-error'); $('#e_uname').classList.remove('show');
    $('#f_umax').classList.remove('has-error'); $('#e_umax').classList.remove('show');
    upd();
  }));
  const ckQ = $('#ck_quick');
  ckQ && ckQ.addEventListener('click', (e) => { e.preventDefault(); bxQ.classList.toggle('on'); sfQ.classList.toggle('show', bxQ.classList.contains('on')); });
  $('#uCancel').addEventListener('click', onCancel);
  save.addEventListener('click', async () => {
    if (save.classList.contains('disabled')) return;
    const min = parseInt(iMin.value, 10) || 1, max = parseInt(iMax.value, 10);
    if (max < min) { $('#f_umax').classList.add('has-error'); $('#e_umax').textContent = '最多容納人數不得小於最少容納人數'; $('#e_umax').classList.add('show'); return; }
    const qty = (bxQ && bxQ.classList.contains('on')) ? Math.max(2, parseInt(($('#i_qty') || {}).value, 10) || 2) : 1;
    const gid = $('#i_ugid') ? $('#i_ugid').value : null;
    try { await onSave({ name: iName.value.trim(), min, max, qty, gid }); }
    catch (err) {
      if (err && err.field === 'name') { $('#f_uname').classList.add('has-error'); $('#e_uname').textContent = err.msg; $('#e_uname').classList.add('show'); }
    }
  });
}
function renderUnitForm(gid) {
  addUnitOpen = true;
  $('#addUnitSlot').innerHTML = unitFormHtml({ title: '新增預約單位' });
  wireUnitForm({
    onCancel: () => { addUnitOpen = false; $('#addUnitSlot').innerHTML = ''; },
    onSave: async ({ name, min, max, qty }) => {
      const n = await api.createUnits(gid, { name, min, max, qty });
      addUnitOpen = false; toast(n > 1 ? `已新增 ${n} 個預約單位` : '已新增預約單位'); viewGroup(gid);
    },
  });
  $('#i_uname').focus();
}

/* 編輯單位 Modal（含分類群組下拉，可搬群組） */
function openEditUnit(uid) {
  const u = db.units.find(x => x.id === uid);
  openModal(`
    <h3>編輯預約單位</h3>
    ${unitFormHtml({ title: '', name: u.name, min: u.min, max: u.max, showQuick: false, gidSelect: db.groups, curGid: u.gid })}
  `);
  $('#uForm').classList.remove('inline-form');
  $('#uForm .if-title') && ($('#uForm').querySelector('.if-title').style.display = 'none');
  wireUnitForm({
    onCancel: closeModal,
    onSave: async ({ name, min, max, gid }) => {
      const from = u.gid;
      await api.updateUnit(uid, { name, min, max, gid });
      closeModal(); toast('已儲存變更'); viewGroup(from === gid ? gid : from);
    },
  });
  $('#uSave').classList.remove('disabled');
}

/* =====================================================
   服務項目 — 預約項目清單（4-1~4-4）
   ===================================================== */
let svcEditMode = false, svcAddOpen = false, svcRenameId = null, svcPendingDel = [];
function viewSvcItems() {
  setTitle([['預約規則', '#/rules'], ['預約項目與時段規則', '#/slots']], '管理預約項目與時段');
  const slotsOf = (iid) => db.svcSlots.filter(s => s.itemId === iid).length;
  const itemForm = (title, name, iid) => `
    <div class="inline-form" id="itemForm">
      <div class="if-title">${title}</div>
      <div class="field" id="f_iname">
        <div class="field-label">預約項目名稱 <span class="err-msg" id="e_iname"></span></div>
        <div class="input"><input id="i_iname" maxlength="12" placeholder="如：顧客諮詢" value="${esc(name || '')}"></div>
      </div>
      <div class="btn-row">
        <button class="btn-md ghost" id="iCancel">取消</button>
        <button class="btn-md primary disabled" id="iSave">儲存</button>
      </div>
    </div>`;
  const rows = db.svcItems.filter(it => !svcPendingDel.includes(it.id)).map(it => `
    ${svcRenameId === it.id ? itemForm('編輯預約項目名稱', it.name, it.id) : `
    <div class="g-row" data-item="${it.id}">
      <div class="gr-main"><div class="gr-name">${esc(it.name)}</div>
      <div class="gr-sub">${slotsOf(it.id)}個時段</div></div>
      ${svcEditMode
        ? `<button class="icon-btn" data-rename="${it.id}">${ICONS.edit}</button><button class="icon-btn danger" data-idel="${it.id}">${ICONS.trash}</button>`
        : `<span class="arrow">${ICONS.chevR}</span>`}
    </div>`}`).join('');
  $('#content').innerHTML = `
    <div class="card">
      <div class="card-head">
        <div class="ch-main">
          <div class="ch-title">預約項目</div>
          <div class="ch-desc">設定預約項目供顧客進行預約，並可各別設置多個開放預約的時段，以及可預約人數、單位與訂金等規則。</div>
        </div>
        ${svcEditMode
          ? `<button class="btn-md ghost" id="svcEditCancel">取消</button><button class="btn-md primary" id="svcEditSave">儲存</button>`
          : `<button class="btn-md ghost" id="svcEditBtn">${ICONS.edit} 編輯</button><button class="btn-md primary" id="svcAddBtn">${ICONS.plus} 項目</button>`}
      </div>
      <div id="svcAddSlot">${svcAddOpen ? itemForm('新增預約項目', '', null) : ''}</div>
      <div class="rows">${rows || '<div class="empty">尚未建立預約項目</div>'}</div>
    </div>`;
  const wireItemForm = (onSave, onCancel) => {
    const iName = $('#i_iname'), save = $('#iSave');
    const upd = () => save.classList.toggle('disabled', !iName.value.trim());
    upd();
    iName.addEventListener('input', () => { $('#f_iname').classList.remove('has-error'); $('#e_iname').classList.remove('show'); upd(); });
    $('#iCancel').addEventListener('click', onCancel);
    save.addEventListener('click', async () => {
      if (save.classList.contains('disabled')) return;
      const name = iName.value.trim();
      if (db.svcItems.some(x => x.name === name && x.id !== svcRenameId)) {
        $('#f_iname').classList.add('has-error'); $('#e_iname').textContent = '此名稱已被使用'; $('#e_iname').classList.add('show'); return;
      }
      await onSave(name);
    });
    iName.focus();
  };
  if (svcAddOpen) wireItemForm(async (name) => {
    await delay(); db.svcItems.push({ id: 'i' + (++db.seq), name }); persist();
    svcAddOpen = false; toast('已新增預約項目'); viewSvcItems();
  }, () => { svcAddOpen = false; viewSvcItems(); });
  if (svcRenameId) wireItemForm(async (name) => {
    await delay(); db.svcItems.find(x => x.id === svcRenameId).name = name; persist();
    svcRenameId = null; toast('已儲存變更'); viewSvcItems();
  }, () => { svcRenameId = null; viewSvcItems(); });
  const b = (id, fn) => { const el = $(id); el && el.addEventListener('click', fn); };
  b('#svcAddBtn', () => { if (!svcAddOpen) { svcAddOpen = true; svcRenameId = null; viewSvcItems(); } });
  b('#svcEditBtn', () => { svcEditMode = true; svcPendingDel = []; svcAddOpen = false; svcRenameId = null; viewSvcItems(); });
  b('#svcEditCancel', () => { svcEditMode = false; svcPendingDel = []; svcRenameId = null; viewSvcItems(); });
  b('#svcEditSave', () => {
    if (!svcPendingDel.length) { svcEditMode = false; viewSvcItems(); return; }
    openModal(`
      <h3>確定儲存變更嗎？</h3>
      <div class="m-body"><p>儲存後，已刪除的預約項目及其時段規則將一併刪除。此操作無法復原，確定儲存變更嗎？</p></div>
      <div class="btn-row">
        <button class="btn-md ghost" onclick="closeModal()">取消</button>
        <button class="btn-md" style="background:var(--alert);color:#fff" id="svcDelOk">刪除並儲存</button>
      </div>`);
    $('#svcDelOk').addEventListener('click', async () => {
      await delay();
      db.svcItems = db.svcItems.filter(x => !svcPendingDel.includes(x.id));
      db.svcSlots = db.svcSlots.filter(s => !svcPendingDel.includes(s.itemId));
      persist(); closeModal();
      svcEditMode = false; svcPendingDel = [];
      toast('已儲存變更'); viewSvcItems();
    });
  });
  document.querySelectorAll('[data-rename]').forEach(x => x.addEventListener('click', (e) => { e.stopPropagation(); svcRenameId = x.dataset.rename; viewSvcItems(); }));
  document.querySelectorAll('[data-idel]').forEach(x => x.addEventListener('click', (e) => { e.stopPropagation(); svcPendingDel.push(x.dataset.idel); viewSvcItems(); }));
  if (!svcEditMode) document.querySelectorAll('[data-item]').forEach(r => r.addEventListener('click', () => location.hash = '#/slots/item/' + r.dataset.item));
}

/* =====================================================
   階層項目 — 父層項目清單（5-1）＋子項目頁（5-5）
   ===================================================== */
let catAddOpen = false, catSubAddOpen = false;
function viewCatParents() {
  setTitle([['預約規則', '#/rules'], ['預約項目與時段規則', '#/slots']], '管理預約項目與時段');
  const subsOf = (pid) => db.catSubs.filter(s => s.pid === pid).length;
  $('#content').innerHTML = `
    <div class="card">
      <div class="card-head">
        <div class="ch-main">
          <div class="ch-title">預約項目</div>
          <div class="ch-desc">設定預約項目及其子項目供顧客進行預約，並可各別設置多個開放預約的時段，以及可預約人數、單位與訂金等規則。</div>
        </div>
        <button class="btn-md primary" id="catAddBtn">${ICONS.plus} 項目</button>
      </div>
      <div id="catAddSlot"></div>
      <div class="rows">
        ${db.catParents.map(p => `
        <div class="g-row" data-cat="${p.id}">
          <div class="gr-main"><div class="gr-name">${esc(p.name)}</div>
          <div class="gr-sub">${subsOf(p.id)}個子項目</div></div>
          <span class="arrow">${ICONS.chevR}</span>
        </div>`).join('') || '<div class="empty">尚未建立預約項目</div>'}
      </div>
    </div>`;
  const renderAdd = () => {
    $('#catAddSlot').innerHTML = `
      <div class="inline-form">
        <div class="if-title">新增預約項目</div>
        <div class="field" id="f_pname">
          <div class="field-label">預約項目名稱 <span class="err-msg" id="e_pname"></span></div>
          <div class="input"><input id="i_pname" maxlength="12" placeholder="如：顧客諮詢"></div>
        </div>
        <div class="btn-row">
          <button class="btn-md ghost" id="pCancel">取消</button>
          <button class="btn-md primary disabled" id="pSave">儲存</button>
        </div>
      </div>`;
    const inp = $('#i_pname'), save = $('#pSave');
    inp.addEventListener('input', () => { $('#f_pname').classList.remove('has-error'); $('#e_pname').classList.remove('show'); save.classList.toggle('disabled', !inp.value.trim()); });
    $('#pCancel').addEventListener('click', () => { catAddOpen = false; viewCatParents(); });
    save.addEventListener('click', async () => {
      if (save.classList.contains('disabled')) return;
      const name = inp.value.trim();
      if (db.catParents.some(x => x.name === name)) { $('#f_pname').classList.add('has-error'); $('#e_pname').textContent = '此名稱已被使用'; $('#e_pname').classList.add('show'); return; }
      await delay(); db.catParents.push({ id: 'p' + (++db.seq), name }); persist();
      catAddOpen = false; toast('已新增預約項目'); viewCatParents();
    });
    inp.focus();
  };
  $('#catAddBtn').addEventListener('click', () => { if (!catAddOpen) { catAddOpen = true; renderAdd(); } });
  if (catAddOpen) renderAdd();
  document.querySelectorAll('[data-cat]').forEach(r => r.addEventListener('click', () => location.hash = '#/slots/cat/' + r.dataset.cat));
}

function viewCatSubs(pid) {
  const p = db.catParents.find(x => x.id === pid);
  if (!p) { location.hash = '#/slots'; return; }
  const subs = db.catSubs.filter(s => s.pid === pid);
  setTitle([['預約規則', '#/rules'], ['預約項目與時段規則', '#/slots'], [p.name, '']], '');
  $('#content').innerHTML = `
    <div class="grp-head-card">
      <div class="ghc-main"><div class="ghc-name">${esc(p.name)}</div>
      <div class="ghc-sub">${subs.length} 個子項目</div></div>
      <button class="btn-md ghost" id="catRenameBtn">${ICONS.edit} 編輯</button>
      <button class="btn-md ghost-red" id="catDelBtn">刪除項目</button>
    </div>
    <div class="card">
      <div class="sec-head">
        <div class="t">子項目 (${subs.length})</div>
        <button class="btn-md primary" id="subAddBtn">${ICONS.plus} 子項目</button>
      </div>
      <div id="subAddSlot"></div>
      <div class="rows">
        ${subs.map(s => `
        <div class="g-row" data-sub="${s.id}">
          <div class="gr-main"><div class="gr-name">${esc(s.name)}</div>
          <div class="gr-sub">${db.catSlots.filter(x => x.itemId === s.id).length}個時段</div></div>
          <button class="icon-btn" data-subren="${s.id}">${ICONS.edit}</button>
          <button class="icon-btn danger" data-subdel="${s.id}">${ICONS.trash}</button>
          <span class="arrow">${ICONS.chevR}</span>
        </div>`).join('') || '<div class="empty">尚未建立子項目</div>'}
      </div>
    </div>`;
  const subForm = (title, init, onSave) => {
    $('#subAddSlot').innerHTML = `
      <div class="inline-form">
        <div class="if-title">${title}</div>
        <div class="field" id="f_sname">
          <div class="field-label">子項目名稱 <span class="err-msg" id="e_sname"></span></div>
          <div class="input"><input id="i_sname" maxlength="12" placeholder="如：限時體驗" value="${esc(init || '')}"></div>
        </div>
        <div class="btn-row">
          <button class="btn-md ghost" id="sCancel">取消</button>
          <button class="btn-md primary${init ? '' : ' disabled'}" id="sSave">儲存</button>
        </div>
      </div>`;
    const inp = $('#i_sname'), save = $('#sSave');
    inp.addEventListener('input', () => { $('#f_sname').classList.remove('has-error'); $('#e_sname').classList.remove('show'); save.classList.toggle('disabled', !inp.value.trim()); });
    $('#sCancel').addEventListener('click', () => { catSubAddOpen = false; viewCatSubs(pid); });
    save.addEventListener('click', async () => {
      if (save.classList.contains('disabled')) return;
      await onSave(inp.value.trim());
    });
    inp.focus();
  };
  $('#subAddBtn').addEventListener('click', () => {
    if (catSubAddOpen) return;
    catSubAddOpen = true;
    subForm('新增子項目', '', async (name) => {
      if (subs.some(x => x.name === name)) { $('#f_sname').classList.add('has-error'); $('#e_sname').textContent = '此名稱已被使用'; $('#e_sname').classList.add('show'); return; }
      await delay(); db.catSubs.push({ id: 'sb' + (++db.seq), pid, name }); persist();
      catSubAddOpen = false; toast('已新增子項目'); viewCatSubs(pid);
    });
  });
  $('#catRenameBtn').addEventListener('click', () => {
    openModal(`
      <h3>編輯預約項目名稱</h3>
      <div class="field" id="f_rn"><div class="field-label">預約項目名稱 <span class="err-msg" id="e_rn"></span></div>
      <div class="input"><input id="i_rn" maxlength="12" value="${esc(p.name)}"></div></div>
      <div class="btn-row">
        <button class="btn-md ghost" onclick="closeModal()">取消</button>
        <button class="btn-md primary" id="rnSave">儲存</button>
      </div>`);
    $('#rnSave').addEventListener('click', async () => {
      const name = $('#i_rn').value.trim();
      if (!name) return;
      if (db.catParents.some(x => x.name === name && x.id !== pid)) { $('#f_rn').classList.add('has-error'); $('#e_rn').textContent = '此名稱已被使用'; $('#e_rn').classList.add('show'); return; }
      await delay(); p.name = name; persist(); closeModal(); toast('已儲存變更'); viewCatSubs(pid);
    });
  });
  $('#catDelBtn').addEventListener('click', () => {
    openModal(`
      <h3>確定刪除嗎？</h3>
      <div class="m-body"><p>刪除後，此預約項目的子項目及其時段規則將一併刪除。此操作無法復原，確定刪除項目「${esc(p.name)}」嗎？</p></div>
      <div class="btn-row">
        <button class="btn-md ghost" onclick="closeModal()">取消</button>
        <button class="btn-md" style="background:var(--alert);color:#fff" id="catDelOk">刪除</button>
      </div>`);
    $('#catDelOk').addEventListener('click', async () => {
      await delay();
      const subIds = db.catSubs.filter(s => s.pid === pid).map(s => s.id);
      db.catParents = db.catParents.filter(x => x.id !== pid);
      db.catSubs = db.catSubs.filter(s => s.pid !== pid);
      db.catSlots = db.catSlots.filter(s => !subIds.includes(s.itemId));
      persist(); closeModal(); toast('已刪除預約項目'); location.hash = '#/slots';
    });
  });
  document.querySelectorAll('[data-subren]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const sub = db.catSubs.find(x => x.id === b.dataset.subren);
    catSubAddOpen = true;
    subForm('編輯子項目名稱', sub.name, async (name) => {
      if (subs.some(x => x.name === name && x.id !== sub.id)) { $('#f_sname').classList.add('has-error'); $('#e_sname').textContent = '此名稱已被使用'; $('#e_sname').classList.add('show'); return; }
      await delay(); sub.name = name; persist();
      catSubAddOpen = false; toast('已儲存變更'); viewCatSubs(pid);
    });
  }));
  document.querySelectorAll('[data-subdel]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const sub = db.catSubs.find(x => x.id === b.dataset.subdel);
    openModal(`
      <h3>確定刪除嗎？</h3>
      <div class="m-body"><p>刪除子項目將同時刪除其時段規則。此操作無法復原，確定刪除子項目「${esc(sub.name)}」嗎？</p></div>
      <div class="btn-row">
        <button class="btn-md ghost" onclick="closeModal()">取消</button>
        <button class="btn-md" style="background:var(--alert);color:#fff" id="subDelOk">刪除</button>
      </div>`);
    $('#subDelOk').addEventListener('click', async () => {
      await delay();
      db.catSubs = db.catSubs.filter(x => x.id !== sub.id);
      db.catSlots = db.catSlots.filter(s => s.itemId !== sub.id);
      persist(); closeModal(); toast('已刪除子項目'); viewCatSubs(pid);
    });
  }));
  document.querySelectorAll('[data-sub]').forEach(r => r.addEventListener('click', (e) => {
    if (e.target.closest('.icon-btn')) return;
    location.hash = '#/slots/item/' + r.dataset.sub;
  }));
}

/* =====================================================
   時段設定 — 清單頁（3-1 / 4-5 / 5-7 / 6-1）
   ===================================================== */
const slotOpen = new Set();
function viewSlots(itemId) {
  const owner = slotOwner(itemId);
  if (itemId && !owner) { location.hash = '#/slots'; return; }
  if (owner) {
    const crumbs = [['預約規則', '#/rules'], ['預約項目與時段規則', '#/slots']];
    if (owner.parent) crumbs.push([owner.parent.name, '#/slots/cat/' + owner.parent.id]);
    crumbs.push([owner.name, '']);
    setTitle(crumbs, owner.name);
  } else setTitle([['預約規則', '#/rules'], ['預約時段與規則', '#/slots']], '');
  const capMode = db.mode === 'capacity';
  const rows = slotList().filter(s => !itemId || s.itemId === itemId).map(s => {
    const times = slotTimes(s);
    const { count, cap } = capMode ? { count: 0, cap: 0 } : slotCap(s);
    const dep = DEPOSITS.find(d => d.id === s.deposit);
    const noUnits = !capMode && count === 0;
    const tag = s.type === 'auto'
      ? `<span class="slot-tag">${s.start} - ${s.end}｜間隔${s.interval}分鐘</span>`
      : times.slice(0, 4).map(t => `<span class="slot-tag">${t}</span>`).join('') + (times.length > 4 ? '<span class="slot-tag">⋯</span>' : '');
    return `
    <div class="slot-card${slotOpen.has(s.id) ? ' open' : ''}" data-s="${s.id}">
      <div class="slot-head" data-toggle="${s.id}">
        <span class="exp">${ICONS.chevR}</span>
        <span class="sname">${esc(s.name)}</span>
        ${noUnits ? '<span class="warn-ic" title="尚未設定預約單位"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5M10.3 3.9 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></span>' : ''}
        <span class="day-mini">${DAY_MINI.map((d, i) => `<span class="${s.days.includes(i + 1) ? 'on' : ''}">${d}</span>`).join('')}</span>
        ${tag}
        <span class="tools">
          <button class="icon-btn" data-edit="${s.id}">${ICONS.edit}</button>
          <button class="icon-btn danger" data-del="${s.id}">${ICONS.trash}</button>
        </span>
      </div>
      <div class="slot-body">
        <div class="slot-col">
          <div class="ct">預約時段</div>
          <li>服務時長：${s.svcH}小時${s.svcM}分鐘</li>
          <li>線上預約可選時段：${times.length}個</li>
          <div class="pills">${times.map(t => `<span class="p">${t}</span>`).join('') || '<span class="none-hint">—</span>'}</div>
        </div>
        <div class="slot-col">
          ${capMode
            ? `<li>開放預約人數：${s.capLimit}人</li>`
            : noUnits
              ? `<div style="color:var(--emphasis-d);font-weight:500">尚未設定預約單位</div>`
              : `<li>開放預約單位：${count}個（最多可承接${cap}人）</li><span class="link-green" data-units="${s.id}">查看預約單位</span>`}
          ${!capMode && s.limitPeople ? `<li>店內總人數上限：${s.limitPeople}人</li>` : ''}
          ${s.limitGroups ? `<li>店內總組數上限：${s.limitGroups}組</li>` : ''}
          ${dep ? `<div class="dep-line"><span class="dn">💰 ${esc(dep.name)}</span><span class="dd">${esc(dep.desc)}</span></div>` : ''}
          ${s.approval ? '<span class="appr-line">✓ 預約需審核</span>' : ''}
        </div>
      </div>
    </div>`;
  }).join('');
  const nSlots = slotList().filter(s => !itemId || s.itemId === itemId).length;
  const newHash = itemId ? '#/slots/item/' + itemId + '/new' : '#/slots/new';
  $('#content').innerHTML = `
    <div class="card">
      <div class="sec-head">
        <div class="t">線上預約時段 (${nSlots})</div>
        <button class="btn-md primary" onclick="location.hash='${newHash}'">${ICONS.plus} 時段</button>
      </div>
      <div class="rows">${rows || '<div class="empty">尚未建立時段</div>'}</div>
    </div>`;
  document.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', (e) => {
    if (e.target.closest('.icon-btn')) return;
    const id = el.dataset.toggle;
    slotOpen.has(id) ? slotOpen.delete(id) : slotOpen.add(id);
    el.closest('.slot-card').classList.toggle('open');
  }));
  document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () =>
    location.hash = itemId ? '#/slots/item/' + itemId + '/edit/' + b.dataset.edit : '#/slots/edit/' + b.dataset.edit));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    const s = slotList().find(x => x.id === b.dataset.del);
    openModal(`
      <h3>確定刪除嗎？</h3>
      <div class="m-body"><p>刪除時段將影響線上預約可選預約時段。此操作無法復原，確定刪除嗎？</p></div>
      <div class="btn-row">
        <button class="btn-md ghost" onclick="closeModal()">取消</button>
        <button class="btn-md" style="background:var(--alert);color:#fff" id="delSlotOk">刪除</button>
      </div>`);
    $('#delSlotOk').addEventListener('click', async () => { await api.deleteSlot(s.id); closeModal(); toast('已刪除時段'); viewSlots(itemId); });
  }));
  document.querySelectorAll('[data-units]').forEach(a => a.addEventListener('click', () => {
    const s = slotList().find(x => x.id === a.dataset.units);
    const us = scopeUnits(s);
    openModal(`
      <h3>開放預約單位（${us.length}）</h3>
      <div class="m-body">
        <div class="unit-grid">${us.map(u => `
          <div class="u-card"><div class="uc-main"><div class="uc-name">${esc(u.name)}</div>
          <div class="uc-cap">${u.min}~${u.max} ${ICONS.person}</div></div></div>`).join('')}</div>
      </div>
      <div class="btn-row"><button class="btn-md ghost" onclick="closeModal()">關閉</button></div>`);
  }));
}

/* =====================================================
   時段設定 — 新增／編輯表單（3-2/3-3）
   ===================================================== */
function viewSlotForm(editId, itemId) {
  const capMode = db.mode === 'capacity';
  const owner = slotOwner(itemId);
  const backHash = itemId ? '#/slots/item/' + itemId : '#/slots';
  const src = editId ? slotList().find(x => x.id === editId) : null;
  if (editId && !src) { location.hash = backHash; return; }
  const f = src ? JSON.parse(JSON.stringify(src)) : {
    id: null, itemId: itemId || null, name: null, days: [], type: 'auto', start: '11:00', end: '12:00', interval: 30,
    times: [], svcH: 2, svcM: 0, scope: 'all', capLimit: null, limitPeople: null, limitGroups: null, deposit: null, approval: false,
  };
  if (!capMode && f.scope !== 'all' && typeof f.scope !== 'object') f.scope = 'all';
  const title = src ? '編輯' + src.name : '新增時段規則';
  const crumbs = [['預約規則', '#/rules'], [owner ? '預約項目與時段規則' : '預約時段與規則', '#/slots']];
  if (owner && owner.parent) crumbs.push([owner.parent.name, '#/slots/cat/' + owner.parent.id]);
  if (owner) crumbs.push([owner.name, backHash]);
  crumbs.push([title, '']);
  setTitle(crumbs, title);

  const err = {};
  const render = () => {
    const times = slotTimes(f);
    const conflicts = slotConflicts(f);
    const { cap } = slotCap(f);
    const dep = DEPOSITS.find(d => d.id === f.deposit);
    $('#content').innerHTML = `
    <div class="fsec">
      <div class="fst">設定線上預約時段</div>
      <div class="field">
        <div class="field-label">適用星期 <span class="err-msg${err.days ? ' show' : ''}">請選擇星期</span></div>
        <div class="day-chips">${DAY_FULL.map((d, i) => `<button class="day-chip${f.days.includes(i + 1) ? ' on' : ''}" data-day="${i + 1}">${d}</button>`).join('')}</div>
      </div>
      <div class="field">
        <div class="field-label">預約時段</div>
        <div class="hint" style="margin-top:-4px">請選擇設定方式</div>
        <div class="radio-card${f.type === 'auto' ? ' on' : ''}" data-type="auto">
          <div class="rc-head"><span class="radio"${f.type === 'auto' ? ' data-on' : ''}></span>自動計算</div>
          <div class="rc-body">
            <div class="inline-ctl">時段範圍
              <div class="input time-input" style="width:auto"><input type="time" id="i_start" value="${f.start}"> → <input type="time" id="i_end" value="${f.end}"></div>
            </div>
            <div class="inline-ctl">時間間隔
              <select class="sel" id="i_interval" style="width:90px">${[15, 30, 45, 60].map(v => `<option ${f.interval == v ? 'selected' : ''}>${v}</option>`).join('')}</select> 分鐘
            </div>
          </div>
        </div>
        <div class="radio-card${f.type === 'custom' ? ' on' : ''}" data-type="custom">
          <div class="rc-head"><span class="radio"${f.type === 'custom' ? ' data-on' : ''}></span>自訂時間</div>
          <div class="rc-body">
            <div class="field-label">時間 <span class="err-msg${err.times ? ' show' : ''}">請點擊「＋時間」新增自訂時間</span></div>
            <div class="custom-times">
              ${f.times.map(t => `<span class="ct-chip">${t}<button data-rmtime="${t}">✕</button></span>`).join('')}
              <div class="input time-input" style="width:auto"><input type="time" id="i_newtime" value="12:00"></div>
              <button class="btn-md ghost-green" id="addTime">＋ 時間</button>
            </div>
          </div>
        </div>
      </div>
      <div class="pills-box">
        <span class="lb">線上預約可選時段預覽</span>
        ${times.length ? `<div class="pills">${times.map(t => `<span class="p">${t}</span>`).join('')}</div>` : '<span class="none-hint">您新增的時間將顯示於此</span>'}
        ${conflicts.length ? `<div class="overlap-err"><b>發現有與其他時段規則重複的可選預約時段</b><span>${conflicts.join('、')}</span></div>` : ''}
      </div>
      <div class="field">
        <div class="field-label">服務時間長度 <span class="err-msg${err.svc ? ' show' : ''}">不可為0</span></div>
        <div class="inline-ctl">
          <select class="sel" id="i_svcH" style="width:80px">${[0,1,2,3,4,5,6,7,8].map(v => `<option ${f.svcH == v ? 'selected' : ''}>${v}</option>`).join('')}</select> 小時
          <select class="sel" id="i_svcM" style="width:80px">${[0,15,30,45].map(v => `<option ${f.svcM == v ? 'selected' : ''}>${v}</option>`).join('')}</select> 分鐘
        </div>
      </div>
    </div>
    <div class="fsec">
      <div class="fst">設定預約承接量</div>
      ${capMode ? `
      <div class="field">
        <div class="field-label">開放預約人數上限 <span class="err-msg${err.capLimit ? ' show' : ''}">請輸入大於或等於 1 的數字</span></div>
        <div class="input num-input" style="width:140px"><input type="number" min="1" id="i_capLimit" placeholder="請輸入數字" value="${f.capLimit === null ? '' : f.capLimit}"></div>
      </div>` : `
      <div class="field">
        <div class="field-label">開放預約單位 <span class="err-msg${err.scope ? ' show' : ''}">請選擇預約單位</span></div>
        <div class="hint" style="margin-top:-4px">請選擇設定方式</div>
        <div class="radio-card${f.scope === 'all' ? ' on' : ''}" data-scope="all">
          <div class="rc-head"><span class="radio"${f.scope === 'all' ? ' data-on' : ''}></span>套用所有預約單位</div>
        </div>
        <div class="radio-card${f.scope !== 'all' ? ' on' : ''}" data-scope="custom">
          <div class="rc-head"><span class="radio"${f.scope !== 'all' ? ' data-on' : ''}></span>自訂預約單位</div>
          <div class="rc-body">
            <div class="hint">*若選擇「自動套用全部」，未來新增至該群組中的預約單位也將自動套用至此時段規則</div>
            <div class="unit-tree">
              ${db.groups.map(g => {
                const us = db.units.filter(u => u.gid === g.id);
                const sel = f.scope !== 'all' ? f.scope[g.id] : undefined;
                return `<div class="ut-g">
                  <div class="ut-gh">${esc(g.name)} (${us.length})</div>
                  <div class="ut-radio">
                    <label><span class="radio"${sel === 'all' ? ' data-on' : ''} data-gall="${g.id}"></span>自動套用全部</label>
                    <label><span class="radio"${Array.isArray(sel) ? ' data-on' : ''} data-gpick="${g.id}"></span>指定預約單位</label>
                  </div>
                  ${Array.isArray(sel) ? `<div class="ut-units">${us.map(u => `
                    <label><span class="box${sel.includes(u.id) ? ' on' : ''}" data-unit="${g.id}:${u.id}"></span>${esc(u.name)}（${u.min}-${u.max}）</label>`).join('')}</div>` : ''}
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>
      </div>
      <div class="pills-box"><span class="lb">最多可承接人數總計</span><b style="font-size:18px">${cap}</b></div>`}
    </div>
    <div class="fsec">
      <div class="fst">進階設定</div>
      <div>
        ${capMode ? '' : `
        <div class="adv-item">
          <label class="check" data-adv="limitPeople"><span class="box${f.limitPeople !== null ? ' on' : ''}"></span>
            <span><span class="ck-label">限制店內總人數</span><div class="ck-desc">限制同一時段店內的總人數（含現場客）。達上限後將暫停開放該時段的線上預約，但仍可自建預約</div></span></label>
          <div class="adv-sub${f.limitPeople !== null ? ' show' : ''}">人數上限
            <div class="input num-input"><input type="number" min="1" id="i_lp" value="${f.limitPeople === null ? 1 : f.limitPeople}"></div>
            <span class="err-msg${err.lp ? ' show' : ''}">請輸入大於或等於 1 的數字</span></div>
        </div>`}
        <div class="adv-item">
          <label class="check" data-adv="limitGroups"><span class="box${f.limitGroups !== null ? ' on' : ''}"></span>
            <span><span class="ck-label">限制店內總組數</span><div class="ck-desc">限制同一時段店內的顧客組數（含現場客）。達上限後將暫停開放該時段的線上預約，但仍可自建預約</div></span></label>
          <div class="adv-sub${f.limitGroups !== null ? ' show' : ''}">組數上限
            <div class="input num-input"><input type="number" min="1" id="i_lg" value="${f.limitGroups === null ? 1 : f.limitGroups}"></div>
            <span class="err-msg${err.lg ? ' show' : ''}">請輸入大於或等於 1 的數字</span></div>
        </div>
        <div class="adv-item">
          <label class="check" data-adv="deposit"><span class="box${f.deposit ? ' on' : ''}"></span>
            <span><span class="ck-label">要求訂金</span><div class="ck-desc">需先於「訂金管理」設定訂金規則；每個預約時段都可套用不同的訂金規則</div></span></label>
          <div class="dep-opts${f.deposit ? ' show' : ''}">
            <div class="field-label" style="font-size:13px">套用規則</div>
            ${DEPOSITS.map(d => `<div class="dep-opt${f.deposit === d.id ? ' on' : ''}" data-dep="${d.id}">
              <span class="radio"${f.deposit === d.id ? ' data-on' : ''}></span>
              <div class="dm"><span class="t">${esc(d.name)}</span><span class="d">${esc(d.desc)}</span></div></div>`).join('')}
          </div>
        </div>
        <div class="adv-item">
          <label class="check" data-adv="approval"><span class="box${f.approval ? ' on' : ''}"></span>
            <span><span class="ck-label">審核預約</span><div class="ck-desc">開啟後所有線上預約將進入待審核狀態，需由商家手動審核，確認預約後將自動發送email告知顧客預約成功</div></span></label>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-md ghost" onclick="location.hash='${backHash}'">取消</button>
        <button class="btn-md primary" id="slotSave">儲存</button>
      </div>
    </div>`;
    // 綁 radio 視覺
    document.querySelectorAll('.radio[data-on]').forEach(r => { r.classList.add('on'); r.style.borderColor = 'var(--primary)'; });
    document.querySelectorAll('.radio[data-on]').forEach(r => r.insertAdjacentHTML('beforeend', '<span style="width:10px;height:10px;border-radius:50%;background:var(--primary)"></span>'));
    // 事件
    document.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => {
      const d = +b.dataset.day;
      f.days.includes(d) ? f.days = f.days.filter(x => x !== d) : f.days.push(d);
      err.days = false; render();
    }));
    document.querySelectorAll('[data-type]').forEach(c => c.addEventListener('click', (e) => {
      if (e.target.closest('input,select,button,.ct-chip')) return;
      if (f.type !== c.dataset.type) { f.type = c.dataset.type; render(); }
    }));
    const bindVal = (id, key, isTime) => { const el = $(id); el && el.addEventListener('change', () => { f[key] = isTime ? el.value : el.value; render(); }); };
    bindVal('#i_start', 'start', true); bindVal('#i_end', 'end', true);
    $('#i_interval') && $('#i_interval').addEventListener('change', () => { f.interval = +$('#i_interval').value; render(); });
    $('#addTime') && $('#addTime').addEventListener('click', () => {
      const t = $('#i_newtime').value;
      if (t && !f.times.includes(t)) { f.times.push(t); err.times = false; render(); }
    });
    document.querySelectorAll('[data-rmtime]').forEach(b => b.addEventListener('click', () => { f.times = f.times.filter(t => t !== b.dataset.rmtime); render(); }));
    $('#i_svcH').addEventListener('change', () => { f.svcH = +$('#i_svcH').value; err.svc = false; render(); });
    $('#i_svcM').addEventListener('change', () => { f.svcM = +$('#i_svcM').value; err.svc = false; render(); });
    document.querySelectorAll('[data-scope]').forEach(c => c.addEventListener('click', (e) => {
      if (e.target.closest('.radio[data-gall],.radio[data-gpick],.box[data-unit],input')) return;
      const v = c.dataset.scope;
      if (v === 'all' && f.scope !== 'all') { f.scope = 'all'; render(); }
      if (v === 'custom' && f.scope === 'all') { f.scope = {}; render(); }
    }));
    document.querySelectorAll('[data-gall]').forEach(r => r.addEventListener('click', (e) => { e.preventDefault(); f.scope[r.dataset.gall] = 'all'; err.scope = false; render(); }));
    document.querySelectorAll('[data-gpick]').forEach(r => r.addEventListener('click', (e) => { e.preventDefault(); f.scope[r.dataset.gpick] = []; render(); }));
    document.querySelectorAll('[data-unit]').forEach(bx => bx.addEventListener('click', (e) => {
      e.preventDefault();
      const [gid, uid] = bx.dataset.unit.split(':');
      const arr = f.scope[gid];
      arr.includes(uid) ? f.scope[gid] = arr.filter(x => x !== uid) : arr.push(uid);
      err.scope = false; render();
    }));
    document.querySelectorAll('[data-adv]').forEach(ck => ck.addEventListener('click', (e) => {
      e.preventDefault();
      const k = ck.dataset.adv;
      if (k === 'approval') f.approval = !f.approval;
      else if (k === 'deposit') f.deposit = f.deposit ? null : DEPOSITS[0].id;
      else f[k] = f[k] === null ? ($('#i_' + (k === 'limitPeople' ? 'lp' : 'lg')) ? +$('#i_' + (k === 'limitPeople' ? 'lp' : 'lg')).value : 1) : null;
      render();
    }));
    $('#i_lp') && $('#i_lp').addEventListener('change', () => { f.limitPeople = $('#i_lp').value === '' ? f.limitPeople : +$('#i_lp').value; });
    $('#i_capLimit') && $('#i_capLimit').addEventListener('input', () => { f.capLimit = $('#i_capLimit').value === '' ? null : +$('#i_capLimit').value; });
    $('#i_lg') && $('#i_lg').addEventListener('change', () => { f.limitGroups = $('#i_lg').value === '' ? f.limitGroups : +$('#i_lg').value; });
    document.querySelectorAll('[data-dep]').forEach(o => o.addEventListener('click', () => { f.deposit = o.dataset.dep; render(); }));
    $('#slotSave').addEventListener('click', async () => {
      Object.keys(err).forEach(k => delete err[k]);
      if (!f.days.length) err.days = true;
      if (f.type === 'custom' && !f.times.length) err.times = true;
      if (f.svcH === 0 && f.svcM === 0) err.svc = true;
      if (capMode) { if (!f.capLimit || f.capLimit < 1) err.capLimit = true; }
      else if (f.scope !== 'all' && scopeUnits(f).length === 0) err.scope = true;
      if (!capMode && f.limitPeople !== null && (!f.limitPeople || f.limitPeople < 1)) err.lp = true;
      if (f.limitGroups !== null && (!f.limitGroups || f.limitGroups < 1)) err.lg = true;
      if (Object.keys(err).length) { render(); toast('內容未正確輸入'); return; }
      if (slotConflicts(f).length) { render(); toast('預約時段不可重複'); return; }
      await api.saveSlot(f);
      toast(src ? '已儲存變更' : '已新增時段規則');
      location.hash = backHash;
    });
  };
  render();
}

};
const ST_ORDER = ['confirmed', 'arrived', 'seated', 'done', 'review', 'pay', 'noshow', 'cancelled'];
const TL_ORIGIN = 570;   // 09:30
const TL_COLS = 24;      // 每格 30 分，到 21:30
const TL_COLW = 74;
const DEMO_NOW = 720;    // 設計稿的「現在」= 12:00


/* toMin 沿用設定區既有的同名函式 */
const toHHMM = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const durText = (m) => (m >= 60 ? Math.floor(m / 60) + '小時' : '') + (m % 60 ? (m % 60) + '分' : (m >= 60 ? '0分' : '0分'));
const dateText = (s) => { const d = new Date(s + 'T00:00:00'); return s.replace(/-/g, '–') + '　' + ['週日', '週一', '週二', '週三', '週四', '週五', '週六'][d.getDay()]; };
const shiftDate = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const unitName = (id) => (db.units.find(u => u.id === id) || {}).name || '—';
const todays = () => db.bookings.filter(b => b.date === bk.date);
const live = (b) => b.status !== 'cancelled' && b.status !== 'noshow';
/* 總量控管沒有預約單位的概念，其餘三模式都有 */
const usesUnits = () => db.mode !== 'capacity';
/* 預約項目來源直接讀設定區的資料，設定改了這裡就跟著改 */
function itemOptions() {
  if (db.mode === 'category') {
    const out = [];
    for (const p of db.catParents) for (const s of db.catSubs.filter(x => x.pid === p.id)) out.push(p.name + '－' + s.name);
    return out;
  }
  if (db.mode === 'service') return db.svcItems.map(i => i.name);
  return [];
}
function durOptions() {
  const list = db.mode === 'capacity' ? db.capSlots : db.mode === 'service' ? db.svcSlots : db.mode === 'category' ? db.catSlots : db.slots;
  const set = new Set(list.map(s => (s.svcH || 0) * 60 + (s.svcM || 0)).filter(Boolean));
  if (!set.size) [60, 90, 120].forEach(v => set.add(v));
  return [...set].sort((a, b) => a - b);
}

/* ===== Part4 注入：臨時預約關閉（資料層與時間軸互動） =====
   與例外頁整合版（part4_exception.html）共用同一把 sessionStorage key，
   定稿頁自己的 db 完全不動。 */
const P4_KEY = 'p4_closures';
const P4_ICON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2 1"/><path d="M5.5 5.5l13 13"/></svg>';
function p4All() { try { return JSON.parse(sessionStorage.getItem(P4_KEY)) || []; } catch (e) { return []; } }
function p4Save(v) { sessionStorage.setItem(P4_KEY, JSON.stringify(v)); }
function p4Of(date) { return p4All().filter(c => c.date === date); }
/* chip 常駐——原本寫成「有資料才顯示」，全新 session 一筆都沒有時，
   整頁看不出 Part 4 加了什麼，reviewer 只會看到一個普通的定稿時間軸 */
function p4Chip() {
  const n = p4All().length;
  return `<span class="bk-chip p4" id="p4Chip">${P4_ICON}臨時關閉 ${n}</span>`;
}
function p4BindChip() {
  const c = document.getElementById('p4Chip');
  if (c) c.onclick = p4OpenDrawer;
}
/* 該日某單位被關閉的分鐘區間 */
function p4RangesOf(date, unitId) {
  return p4Of(date).filter(c => c.unitIds.includes(unitId)).map(c => [toMin(c.start), toMin(c.end)]);
}
let p4Sel = null, p4Drag = false;
/* ⚠️ 時間軸的空白區在定稿裡已經是「點擊＝在該時間與桌位快速新增預約」
   （Figma 2-1-1 有 時間軸/清單/空間圖 三個新增預約變體）。同一個位置不能有兩種行為，
   所以臨時關閉改成「模式切換」：預設完全不攔截，進入關閉模式後才啟用框選。 */
let p4Mode = false;
/* ⚠️ window 監聽器只能綁一次。p4Timeline 每次重繪都呼叫，若每次 addEventListener，
   監聽器會越疊越多：舊的（持有失效 DOM 參照）先更新 p4Sel，新的再進來就以為
   「位置沒變」而提早 return，結果框選永遠只有一格。改為綁一次＋共用 p4Ctx。 */
let p4Bound = false, p4Ctx = null;
function p4EnterMode(){ p4Mode = true; p4Sel = null; viewBooking(); }
function p4ExitMode(){ p4Mode = false; p4Sel = null; viewBooking(); }

function p4Timeline(rows) {
  const inner = document.querySelector('.tl-inner');
  if (!inner) return;
  p4Hint();
  const rowEls = [...inner.querySelectorAll('.tl-row')];

  /* 已關閉區塊 */
  rowEls.forEach((el, i) => {
    const u = rows[i]; if (!u) return;
    p4RangesOf(bk.date, u.id).forEach(([s, e]) => {
      const s2 = Math.max(TL_ORIGIN, s), e2 = Math.min(TL_ORIGIN + TL_COLS * 30, e);
      if (e2 <= s2) return;
      const d = document.createElement('div');
      d.className = 'p4-closed';
      d.style.left = (s2 - TL_ORIGIN) / 30 * TL_COLW + 'px';
      d.style.width = (e2 - s2) / 30 * TL_COLW - 2 + 'px';
      d.textContent = '已關閉線上預約';
      el.appendChild(d);
    });
  });

  /* 框選 */
  /* 先看事件目標（拖曳中滑鼠底下的元素會冒泡上來），沒有再用座標反查 */
  const cellOf = (ev) => {
    let row = ev.target && ev.target.closest ? ev.target.closest('.tl-row') : null;
    if (!row) {
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      row = el && el.closest ? el.closest('.tl-row') : null;
    }
    if (!row) return null;
    const r = rowEls.indexOf(row);
    const rect = inner.getBoundingClientRect();
    const c = Math.floor((ev.clientX - rect.left) / TL_COLW);
    if (r < 0 || c < 0 || c >= TL_COLS) return null;
    return { r, c };
  };
  inner.addEventListener('mousedown', ev => {
    if (ev.target.closest('.tl-chip')) return;   // 點預約卡沿用定稿頁的 popover
    if (!p4Mode) {
      // 非關閉模式：此處是定稿的「新增預約」入口，臨時關閉不搶這個手勢
      if (cellOf(ev)) toast('定稿行為：點空白＝在此時間與桌位快速新增預約。要臨時關閉請按右上「臨時關閉」→ 進入關閉模式');
      return;
    }
    const p = cellOf(ev); if (!p) return;
    ev.preventDefault();
    p4Drag = true; p4Sel = { r0: p.r, c0: p.c, r1: p.r, c1: p.c };
    p4Paint(rows, rowEls, inner);
  });
  p4Ctx = { rows, rowEls, inner, cellOf };
  if (!p4Bound) {
    p4Bound = true;
    window.addEventListener('mousemove', ev => {
      if (!p4Drag || !p4Ctx) return;
      const p = p4Ctx.cellOf(ev); if (!p) return;
      if (p.r === p4Sel.r1 && p.c === p4Sel.c1) return;
      p4Sel.r1 = p.r; p4Sel.c1 = p.c;
      p4Paint(p4Ctx.rows, p4Ctx.rowEls, p4Ctx.inner);
    });
    window.addEventListener('mouseup', () => { p4Drag = false; });
  }

  if (p4Sel) p4Paint(rows, rowEls, inner);
}

function p4Rect() {
  if (!p4Sel) return null;
  return { r0: Math.min(p4Sel.r0, p4Sel.r1), r1: Math.max(p4Sel.r0, p4Sel.r1),
           c0: Math.min(p4Sel.c0, p4Sel.c1), c1: Math.max(p4Sel.c0, p4Sel.c1) };
}
function p4Paint(rows, rowEls, inner) {
  inner.querySelectorAll('.p4-sel').forEach(e => e.remove());
  document.querySelectorAll('.p4-bar').forEach(e => e.remove());
  const R = p4Rect(); if (!R) return;
  for (let r = R.r0; r <= R.r1; r++) {
    const el = rowEls[r]; if (!el) continue;
    const d = document.createElement('div');
    d.className = 'p4-sel';
    d.style.left = R.c0 * TL_COLW + 'px';
    d.style.width = (R.c1 - R.c0 + 1) * TL_COLW - 2 + 'px';
    d.style.top = '2px'; d.style.bottom = '2px';
    el.appendChild(d);
  }
  const units = rows.slice(R.r0, R.r1 + 1);
  const start = toHHMM(TL_ORIGIN + R.c0 * 30), end = toHHMM(TL_ORIGIN + (R.c1 + 1) * 30);
  const allClosed = units.every(u => p4RangesOf(bk.date, u.id).some(([s, e]) => s <= TL_ORIGIN + R.c0 * 30 && e >= TL_ORIGIN + (R.c1 + 1) * 30));
  const bar = document.createElement('div');
  bar.className = 'p4-bar';
  bar.innerHTML = `<span>已選 <b>${units.map(u => esc(u.name)).join('、')}</b>　${start}–${end}</span>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="btn-md ghost" id="p4Cancel">取消</button>
      <button class="btn-md ${allClosed ? 'ghost-green' : 'primary'}" id="p4Do">${allClosed ? '恢復開放線上預約' : '關閉線上預約'}</button>
    </div>`;
  document.getElementById('bkMain').appendChild(bar);
  bar.querySelector('#p4Cancel').onclick = () => { p4Sel = null; renderTimeline(); };
  bar.querySelector('#p4Do').onclick = () => {
    const ids = units.map(u => u.id);
    if (allClosed) {
      p4Save(p4All().filter(c => !(c.date === bk.date && c.start === start && c.end === end && c.unitIds.some(i => ids.includes(i)))));
      toast('已恢復開放線上預約');
    } else {
      p4Save(p4All().concat({ id: 'p4_' + p4All().length + '_' + start, date: bk.date, start, end, unitIds: ids }));
      toast(`已關閉線上預約：${ids.length} 個單位 ${start}–${end}`);
    }
    p4Sel = null; viewBooking();   // 留在關閉模式，方便連續關好幾張桌
  };
}

/* 時間軸上方的常駐操作提示：框選是拖曳手勢，沒有提示 reviewer 不會知道要做什麼 */
function p4ModeBar(){

/* ---------- 時間軸 ---------- *//* ---------- 時間軸 ---------- */
function renderTimeline() {
  const groups = db.groups.map(g => ({ g, us: db.units.filter(u => u.gid === g.id) })).filter(x => x.us.length);
  if (!groups.length) { $('#bkMain').innerHTML = `<div class="ls-empty">尚未設定預約單位，請先到「設定 → 預約單位」建立群組與單位。</div>`; return; }
  const rows = groups.flatMap(x => x.us);
  const times = Array.from({ length: TL_COLS }, (_, i) => toHHMM(TL_ORIGIN + i * 30));
  const bs = todays().filter(live);

  const side = `<div class="tl-side"><div class="sh">組別/桌次</div>${groups.map(({ g, us }) => `
      <div class="tl-g">
        <div class="tl-gl">${esc(g.name)}<small>${Math.min(...us.map(u => u.min))}–${Math.max(...us.map(u => u.max))}</small></div>
        <div class="tl-us">${us.map(u => `<div>${esc(u.name)}</div>`).join('')}</div>
      </div>`).join('')}</div>`;

  const rowHtml = rows.map((u, i) => {
    const chips = bs.filter(b => (b.unitIds || []).includes(u.id)).map(b => {
      const s = Math.max(TL_ORIGIN, toMin(b.start));
      const e = Math.min(TL_ORIGIN + TL_COLS * 30, toMin(b.start) + b.dur);
      if (e <= s) return '';
      const m = ST[b.status];
      return `<div class="tl-chip" data-b="${b.id}" style="left:${(s - TL_ORIGIN) / 30 * TL_COLW}px;width:${(e - s) / 30 * TL_COLW - 4}px;background:${m.chipBg};color:${m.chipFg};border-color:${m.chipBd}">
        <div class="n">${esc(b.start)} ${b.pos ? '<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>' : ''}${esc(b.name)}</div>
        <div class="p">${esc(b.phone)}</div>
        <div class="cnt">${b.adults + b.kids} <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.3-3 4-4.4 7-4.4s5.7 1.4 7 4.4"/></svg></div>
        ${b.dupe ? `<div class="bang" style="background:var(--alert)">!</div>` : b.status === 'seated' ? `<div class="bang" style="background:var(--emphasis)">!</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="tl-row${i % 2 ? ' alt' : ''}">${chips}</div>`;
  }).join('');

  $('#bkMain').innerHTML = `<div class="tl">${side}
    <div class="tl-scroll"><div class="tl-inner" style="width:${TL_COLS * TL_COLW}px">
      <div class="tl-th">${times.map(t => `<span>${t}</span>`).join('')}</div>

    </div></div></div>`;
  document.querySelectorAll('.tl-chip').forEach(c => c.onclick = (e) => openPopover(c.dataset.b, e));
  p4Timeline(rows);
}

/* ---------- 空間圖 ---------- */
function renderSpace() {
  const groups = db.groups.filter(g => db.units.some(u => u.gid === g.id));
  if (!groups.length) { $('#bkMain').innerHTML = `<div class="ls-empty">尚未設定預約單位。</div>`; return; }
  if (!groups.some(g => g.id === bk.spTab)) bk.spTab = groups[0].id;
  const bs = todays().filter(live);
  const units = db.units.filter(u => u.gid === bk.spTab);

  const shapes = units.map(u => {
    const b = bs.find(x => (x.unitIds || []).includes(u.id) && toMin(x.start) <= DEMO_NOW && DEMO_NOW < toMin(x.start) + x.dur)
           || bs.find(x => (x.unitIds || []).includes(u.id));
    const m = b ? ST[b.status] : null;
    const solid = b && (b.status === 'seated' || b.status === 'arrived' || b.status === 'pay');
    const style = b ? `background:${solid ? m.chipBg : 'var(--primary-l3)'};color:${solid ? '#fff' : 'var(--text-strong)'};border-color:${solid ? 'transparent' : 'var(--primary)'}` : '';
    return `<div class="sp-u ${u.max > 4 ? 'circ' : 'rect'}" ${b ? `data-b="${b.id}"` : ''}>
      <div class="sp-shape" style="${style}">
        <div>${esc(u.name)}</div><div class="cap">(${u.min}–${u.max})</div>
        ${b && (b.status === 'arrived' || b.status === 'seated') ? `<div class="bar">${esc(b.start)}</div>` : ''}
      </div>
      ${b && b.dupe ? '<div class="bang">!</div>' : ''}
      ${b && b.status === 'confirmed' ? '<div class="bell"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5 1.5 5h-15S6 13 6 9z"/><path d="M10.5 19a1.8 1.8 0 0 0 3 0"/></svg></div>' : ''}
    </div>`;
  }).join('');

  $('#bkMain').innerHTML = `
    <div class="sp-tabs">${groups.map(g => `<button data-g="${g.id}" class="${g.id === bk.spTab ? 'on' : ''}">${esc(g.name)}</button>`).join('')}</div>
    <div class="sp-canvas">${shapes}</div>`;
  document.querySelectorAll('.sp-tabs button').forEach(b => b.onclick = () => { bk.spTab = b.dataset.g; renderSpace(); });
  p4Note();
  document.querySelectorAll('.sp-u[data-b]').forEach(c => c.onclick = (e) => openPopover(c.dataset.b, e));
}

/* ---------- 清單 ---------- */
function renderList() {
  const all = todays();
  const tabs = ST_ORDER.map(s => [s, ST[s].name, all.filter(b => b.status === s).length]);
  const rows = all.filter(b => b.status === bk.lsTab).sort((a, b) => toMin(a.start) - toMin(b.start));

  let body = '';
  if (!rows.length) body = `<div class="ls-empty">這個狀態目前沒有預約。</div>`;
  else {
    body += `<div class="ls-daybar">${esc(dateText(bk.date))}</div>`;
    let cur = null;
    for (const b of rows) {
      if (b.start !== cur) {
        cur = b.start;
        const same = rows.filter(x => x.start === cur);
        body += `<div class="ls-timebar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${esc(cur)}<span>組數：${same.length}</span><span>人數：${same.reduce((a, x) => a + x.adults + x.kids, 0)}</span></div>`;
      }
      body += listCard(b);
    }
  }
  $('#bkMain').innerHTML = `
    <div class="ls-tabs">${tabs.map(([s, n, c]) => `<button data-s="${s}" class="${bk.lsTab === s ? 'on' : ''}">${n} ${c}</button>`).join('')}</div>
    <div class="ls-body">${body}</div>`;
  p4Note();
  document.querySelectorAll('.ls-tabs button').forEach(b => b.onclick = () => { bk.lsTab = b.dataset.s; renderList(); });
  bindCardActions('#bkMain');
}

/* ---------- 預約卡片 popover ---------- */

  const m = ST[b.status];
  const units = (b.unitIds || []).map(unitName);
  const elapsed = DEMO_NOW - toMin(b.start);
  $('#popBox').innerHTML = `
    <div class="hd"><div class="t">${esc(b.start)} – ${esc(toHHMM(toMin(b.start) + b.dur))}</div>
      <div class="s" style="background:${m.chipBg};color:${m.chipFg}">${m.name}</div></div>
    <div class="bd">
      ${b.status === 'seated' ? `<div style="display:flex;align-items:center;gap:8px">
        <span style="color:var(--emphasis-d)">⏱ ${esc(b.start)} 入座</span>
        <span style="margin-left:auto">累計時間：${durText(Math.max(0, elapsed))}</span></div>` : ''}
      <div style="display:flex;align-items:baseline;gap:6px">
        <span style="font-size:17px;font-weight:500;color:var(--text-strong)">${esc(b.name)}</span>
        <em style="font-style:normal;font-size:12px;color:var(--text-muted)">${esc(b.title)}</em>

      <div>${esc(b.phone)}</div>
      ${units.length ? `<div style="display:flex;gap:5px;flex-wrap:wrap">${units.map(n => `<span class="ls-tag unit">${esc(n)}</span>`).join('')}</div>` : ''}
      ${b.item ? `<div>${esc(b.item)}</div>` : ''}
      ${b.tags.length ? `<div style="display:flex;gap:5px;flex-wrap:wrap">${b.tags.map(t => `<span class="ls-tag">${esc(t)}</span>`).join('')}</div>` : ''}
      ${b.q ? `<div>1. ${esc(b.q)}</div>` : ''}
      ${b.note ? `<div>👤 顧客備註 ${esc(b.note)}</div>` : ''}
      ${b.shopNote ? `<div>📝 店家備註 ${esc(b.shopNote)}</div>` : ''}
      <div style="text-align:right;font-size:12px;color:${b.pos ? 'var(--primary-dark)' : 'var(--alert)'}">${b.pos ? '與肚肚同步: ' + esc(b.updatedAt) + ' ✓' : '未與肚肚同步'}</div>
    </div>
    <div class="ft" style="gap:8px">
      <button class="btn-sm ghost" data-edit="${b.id}">✎ 修改</button>
      ${m.next ? `<button class="btn-sm primary" data-next="${b.id}">${m.next[1]}</button>` : ''}
    </div>`;
  const mask = $('#popMask'); mask.classList.add('show');
  const box = $('#popBox');
  const r = ev.currentTarget.getBoundingClientRect();
  const w = 324, h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left)) + 'px';
  box.style.top = (r.bottom + h + 8 < window.innerHeight ? r.bottom + 6 : Math.max(8, r.top - h - 6)) + 'px';
  bindCardActions('#popBox');
  box.querySelectorAll('[data-edit],[data-next]').forEach(el => {
    const prev = el.onclick;
    el.onclick = (e) => { closePopover(); prev(e); };
  });
}
function closePopover() { $('#popMask').classList.remove('show'); }
$('#popMask').addEventListener('click', (e) => { if (e.target === $('#popMask')) closePopover(); });

    name: '', title: '其他', phone: '', email: '', note: '', shopNote: '',

  const b = id ? db.bookings.find(x => x.id === id) : null;

            `<button data-q="${o}" class="${bf.qChoice.includes(o) ? 'on' : ''}">${o}</button>`).join('')}</div></div>
          <div><label>問卷數量統計</label><select id="bfQCount">${['大人x1', '大人x2', '小孩x1'].map(o =>
            `<option ${o === bf.qCount ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
        </div>` : ''}
      </div>
      <div class="toggline">要求訂金
        <button class="togg ${bf.depositOn ? 'on' : ''} ${bf.depositLocked ? 'lock' : ''}" id="bfDepTog"><i></i></button></div>
      ${bf.depositLocked ? `<div class="errmsg" style="color:var(--text-muted);margin-top:0">已要求訂金的預約不可再修改訂金設定</div>` : ''}
      ${bf.depositOn ? `
        <div class="fld"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h5M9.5 14.5h5"/></svg>
          <input id="bfDepAmt" value="${bf.deposit || ''}" placeholder="訂金金額" ${bf.depositLocked ? 'disabled' : ''}></div>
        <div class="subbox"><span>收款方式</span>
          <label><input type="radio" name="bfWay" value="prepay" ${bf.depositWay === 'prepay' ? 'checked' : ''} ${bf.depositLocked ? 'disabled' : ''}>預先收款</label>
          <label><input type="radio" name="bfWay" value="card" ${bf.depositWay === 'card' ? 'checked' : ''} ${bf.depositLocked ? 'disabled' : ''}>信用卡授權綁定</label></div>
        <div class="subbox"><span>訂金通知方式</span>
          <label><input type="checkbox" id="bfNotifyE" ${bf.notifyEmail ? 'checked' : ''} ${bf.walkin ? 'disabled' : ''}>以email通知</label>
          <label><input type="checkbox" id="bfNotifyL" ${bf.notifyLine ? 'checked' : ''} ${bf.walkin ? 'disabled' : ''}>以LINE/簡訊通知</label></div>` : ''}
    </div>
    <div class="bkf-ft"><button id="bfSubmit">${editing ? '儲存變更' : '新增預約'}</button></div>`;

  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
  const rerender = (fn) => (e) => { fn(e); renderBookingForm(); };
  $('#bfClose').onclick = () => closeBookingForm(false);
  on('#bfWalkin', 'change', rerender(e => { bf.walkin = e.target.checked; }));
  on('#bfItem', 'change', e => { bf.item = e.target.value; });
  on('#bfDate', 'change', e => { bf.date = e.target.value; });
  on('#bfStart', 'change', rerender(e => { bf.start = e.target.value; }));
  on('#bfDur', 'change', e => { bf.dur = +e.target.value; });
  $('#aMinus').onclick = () => { if (bf.adults > 1) { bf.adults--; renderBookingForm(); } };
  $('#aPlus').onclick = () => { bf.adults++; renderBookingForm(); };
  $('#kMinus').onclick = () => { if (bf.kids > 0) { bf.kids--; renderBookingForm(); } };
  $('#kPlus').onclick = () => { bf.kids++; renderBookingForm(); };
  on('#bfPhone', 'input', e => { bf.phone = e.target.value; });
  on('#bfName', 'input', e => { bf.name = e.target.value; });
  on('#bfEmail', 'input', e => { bf.email = e.target.value; });
  on('#bfShopNote', 'input', e => { bf.shopNote = e.target.value; });
  on('#bfQ', 'input', e => { bf.q = e.target.value; });
  on('#bfQCount', 'change', e => { bf.qCount = e.target.value; });
  document.querySelectorAll('input[name=bfTitle]').forEach(r => r.addEventListener('change', e => { bf.title = e.target.value; }));
  document.querySelectorAll('input[name=bfWay]').forEach(r => r.addEventListener('change', e => { bf.depositWay = e.target.value; }));
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = rerender(() => {
    const o = b.dataset.q;
    bf.qChoice = bf.qChoice.includes(o) ? bf.qChoice.filter(x => x !== o) : bf.qChoice.concat(o);
  }));
  $('#bfQTop').onclick = () => { bf.qOpen = !bf.qOpen; renderBookingForm(); };
  $('#bfDepTog').onclick = () => {
    if (bf.depositLocked) return toast('已要求訂金，不可再修改');
    bf.depositOn = !bf.depositOn; if (!bf.depositOn) bf.deposit = 0; renderBookingForm();
  };
  on('#bfDepAmt', 'input', e => { bf.deposit = +e.target.value || 0; });
  on('#bfNotifyE', 'change', e => { bf.notifyEmail = e.target.checked; });
  on('#bfNotifyL', 'change', e => { bf.notifyLine = e.target.checked; });
  if ($('#bfPickUnits')) $('#bfPickUnits').onclick = () => {
    if (!db.units.length) return toast('尚未設定預約單位，請先到「設定 → 預約單位」建立');
    bfPane = 'units'; bfPick = bf.unitIds.slice(); bfFilter = 'all'; renderBookingForm();
  };
  $('#bfSubmit').onclick = submitBookingForm;
}

async function submitBookingForm() {
  if (!bf.start) return toast('請選擇時間');
  if (!bf.walkin && (!bf.phone.trim() || !bf.name.trim())) {
    const bad = !bf.phone.trim() ? '#fPhone' : '#fName';
    if ($(bad)) $(bad).classList.add('err');
    return toast('請填寫手機號碼與姓名');
  }
  if (usesUnits() && !db.units.length) return toast('尚未設定預約單位，請先到「設定 → 預約單位」建立');
  if (usesUnits() && !bf.unitIds.length) return toast('請選擇預約單位');
  if (bf.depositOn && !bf.deposit) return toast('請填寫訂金金額');

  const btn = $('#bfSubmit'); btn.disabled = true; btn.textContent = '儲存中…';
  const payload = {
    id: bf.id, date: bf.date, start: bf.start, dur: bf.dur, adults: bf.adults, kids: bf.kids,
    name: bf.walkin ? (bf.name || '現場顧客') : bf.name, title: bf.title, phone: bf.phone, email: bf.email,
    note: bf.note, shopNote: bf.shopNote, item: bf.item, unitIds: bf.unitIds, walkin: bf.walkin,
    status: bf.status, deposit: bf.depositOn ? bf.deposit : 0, depositWay: bf.depositWay,
    tags: bf.tags, q: bf.qOpen ? bf.q : '', source: '自建', pos: bf.pos, dupe: bf.dupe,
  };
  const editing = !!bf.id;
  await api.saveBooking(payload);
  closeBookingForm(true);
  toast(editing ? '已儲存變更' : (payload.walkin ? '已新增預約（現場客不發送通知）' : '已新增預約'));
  viewBooking();
}

/* ---------- 選擇預約單位 ---------- */
let bfPick = [], bfFilter = 'all';
function renderUnitPicker() {
  const need = bf.adults + bf.kids;
  const picked = db.units.filter(u => bfPick.includes(u.id));
  const cap = picked.reduce((a, u) => a + u.max, 0);
  const lack = Math.max(0, need - cap);
  const groups = db.groups.filter(g => db.units.some(u => u.gid === g.id))
    .filter(g => bfFilter === 'all' || g.id === bfFilter);

  $('#bkfPanel').innerHTML = `
    <div class="bkf-hd"><span style="width:24px"></span><h3 style="color:var(--text-strong)">選擇預約單位</h3>
      <button id="bfUClose" aria-label="關閉">${SVG_X}</button></div>
    <div class="bkf-bd">
      <div class="bku-sum">
        <div>預約人數 <b>${need}</b> 人</div>
        <div>已選預約單位 <b>${picked.length}</b> 個</div>
        <div class="lack">尚不足 <b>${lack}</b> 人</div>
      </div>
      <div class="bku-bar">
        <button class="all" id="bfUAll">${bfPick.length === db.units.length ? '取消全選' : '選擇全部'}</button>
        <select id="bfUFilter"><option value="all">所有群組</option>
          ${db.groups.filter(g => db.units.some(u => u.gid === g.id)).map(g =>
            `<option value="${g.id}" ${bfFilter === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select>
      </div>
      ${groups.map(g => {
        const us = db.units.filter(u => u.gid === g.id);
        const allOn = us.every(u => bfPick.includes(u.id));
        return `<div class="bku-g">
          <label><input type="checkbox" data-g="${g.id}" ${allOn ? 'checked' : ''}>${esc(g.name)} (${us.length})</label>
          <div class="bku-chips">${us.map(u => `<button data-u="${u.id}" class="${bfPick.includes(u.id) ? 'on' : ''}">
            ${esc(u.name)}<small>${u.min}–${u.max}</small></button>`).join('')}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="bku-ft"><button id="bfUBack">返回</button><button class="pri" id="bfUOk">確定</button></div>`;

  $('#bfUClose').onclick = () => closeBookingForm(false);
  $('#bfUBack').onclick = () => { bfPane = 'form'; renderBookingForm(); };
  $('#bfUOk').onclick = () => {
    if (lack > 0) return toast(`所選單位還不足 ${lack} 人`);
    bf.unitIds = bfPick.slice(); bfPane = 'form'; renderBookingForm();
  };
  $('#bfUAll').onclick = () => {
    bfPick = bfPick.length === db.units.length ? [] : db.units.map(u => u.id);
    renderUnitPicker();
  };
  $('#bfUFilter').onchange = (e) => { bfFilter = e.target.value; renderUnitPicker(); };
  document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => {
    const id = b.dataset.u;
    bfPick = bfPick.includes(id) ? bfPick.filter(x => x !== id) : bfPick.concat(id);
    renderUnitPicker();
  });
  document.querySelectorAll('[data-g]').forEach(c => c.onchange = () => {
    const ids = db.units.filter(u => u.gid === c.dataset.g).map(u => u.id);
    bfPick = c.checked ? [...new Set(bfPick.concat(ids))] : bfPick.filter(x => !ids.includes(x));
    renderUnitPicker();
  });
}

route();
</script>
</body>
</html>
