<!doctype html>
<meta charset="utf-8">
<title>booking-pilot smoke test</title>
<body style="font:13px/1.5 monospace">
<pre id="out">running…</pre>
<script>
const MODES = ["basic", "service", "hier"];
const MODE_FILE = { basic: "1-基本人數預約.html", service: "2-服務項目預約.html", hier: "3-階層項目預約.html" };
const SECTIONS = ["1-1", "1-2", "1-3", "1-4", "1-5", "1-6", "1-7"];

const files = [];
for (const m of MODES) {
  files.push({ url: "../" + MODE_FILE[m], expect: "view-booking" });
  for (const s of SECTIONS) {
    files.push({ url: `../sections/${m}-${s}.html`, section: s, mode: m });
  }
}

const EXPECT_VIEW = { "1-1": "view-booking", "1-2": "view-booking", "1-3": "view-form",
  "1-4": "view-modify", "1-5": "view-success", "1-6": "view-booking", "1-7": "view-booking" };
const EXPECT_MODAL = { "1-2": "modal-branches", "1-6": "modal-lookup" };

async function check(f) {
  return new Promise((done) => {
    const fr = document.createElement("iframe");
    fr.style.cssText = "width:1024px;height:900px;position:absolute;left:-9999px";
    const errors = [];
    fr.onload = () => {
      const w = fr.contentWindow, d = fr.contentDocument;
      w.addEventListener("error", (e) => errors.push(String(e.message)));
      setTimeout(() => {
        const res = { url: f.url, errors };
        const view = ["view-booking", "view-form", "view-success", "view-modify"]
          .find((v) => d.getElementById(v) && !d.getElementById(v).hidden);
        res.view = view;
        if (f.section) {
          const want = EXPECT_VIEW[f.section];
          if (view !== want) res.errors.push(`view=${view} want=${want}`);
          const modal = EXPECT_MODAL[f.section];
          if (modal && d.getElementById(modal).hidden) res.errors.push(`${modal} not open`);
          if (f.mode !== "basic" && f.section === "1-1" && d.getElementById("item-panel").hidden)
            res.errors.push("item-panel hidden in item mode");
        }
        const broken = [...d.querySelectorAll("img")]
          .filter((i) => i.complete && i.naturalWidth === 0 && i.offsetParent !== null)
          .map((i) => i.getAttribute("src"));
        if (broken.length) res.errors.push("broken img: " + [...new Set(broken)].join(", "));
        res.slots = d.querySelectorAll(".slot").length;
        fr.remove();
        done(res);
      }, 2600);
    };
    fr.src = f.url;
    document.body.appendChild(fr);
  });
}

(async () => {
  const out = document.getElementById("out");
  const lines = [];
  let fails = 0;
  for (const f of files) {
    const r = await check(f);
    const ok = r.errors.length === 0;
    if (!ok) fails++;
    lines.push(`${ok ? "PASS" : "FAIL"}  ${r.url.padEnd(34)} view=${r.view || "-"} slots=${r.slots}` +
      (ok ? "" : "\n        " + r.errors.join("\n        ")));
    out.textContent = lines.join("\n");
  }
  out.textContent = lines.join("\n") + `\n\n=== ${files.length - fails}/${files.length} passed ===`;
  window.SMOKE_DONE = true;
})();
</script>
