<style>
/* ── Part4 專用（其餘 token 與元件沿用 sim.html） ── */
.vsw{position:fixed;top:12px;right:16px;z-index:300;display:flex;gap:0;background:#fff;border:1px solid var(--border-field);border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.08)}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
function openModal(html) { $('#modalBox').innerHTML = html; $('#modalMask').classList.add('show'); }
function closeModal() { $('#modalMask').classList.remove('show'); }
$('#modalMask').addEventListener('click', e => { if (e.target === $('#modalMask')) closeModal(); });

/* ── 假資料 ── */
const DB_KEY = 'part4_v1';
const seed = () => ({
  groups: [
    { id: 'g1', name: 'B區', units: [
      { id: 'u1', name: 'B1', cap: '1~2' }, { id: 'u2', name: 'B2', cap: '1~2' },
      { id: 'u3', name: 'B3', cap: '1~2' }, { id: 'u4', name: 'B4', cap: '1~2' }] },
    { id: 'g2', name: '戶外', units: [
      { id: 'u5', name: 'D1', cap: '1~4' }, { id: 'u6', name: 'D2', cap: '1~4' }] },
    { id: 'g3', name: '室內', units: [
      { id: 'u7', name: 'C1', cap: '1~4' }, { id: 'u8', name: 'C2', cap: '1~4' },
      { id: 'u9', name: 'C3', cap: '3~4' }] },
  ],
  // 時間軸顯示排序（來自「後台操作偏好 > 預約單位排序」，扁平、可跨群組）— 臨時關閉清單依此排
  displayOrder: ['u1', 'u2', 'u5', 'u6', 'u3', 'u4', 'u7', 'u8', 'u9'],
  depositOn: true,
  merchantNo: 'MNU00',   // 示意值，非真實商店代號
  deposits: [
    { id: 'd1', name: '假日訂位訂金', way: 'prepay', cond: 'people', minPeople: 1, perPerson: 100, fixed: 200, usedBy: ['假日時段規則', '例外：中秋連假'] },
    { id: 'd2', name: '包廂綁卡', way: 'auth', cond: 'fixed', minPeople: 4, perPerson: 100, fixed: 1000, usedBy: ['服務選項：包廂'] },
  ],
  closures: [
    { id: 'c1', date: '2026-08-14', start: '18:00', end: '20:00', unitIds: ['u1', 'u2'] },
    { id: 'c2', date: '2026-08-28', start: '17:00', end: '22:00', unitIds: ['u9'] },
  ],
  // 版本 C 的時間軸範例預約（只為了讓框選有真實脈絡，不是 Part 4 範圍）
  bookings: [
    { id: 'b1', unitId: 'u1', start: '12:00', dur: 120, name: '陳小姐 2 位' },
    { id: 'b2', unitId: 'u5', start: '13:00', dur: 90, name: '林先生 4 位' },
    { id: 'b3', unitId: 'u7', start: '18:30', dur: 120, name: '王小姐 3 位' },
    { id: 'b4', unitId: 'u3', start: '19:00', dur: 90, name: '張先生 2 位' },
  ],
  seq: 3,
});
let db;
try { db = JSON.parse(sessionStorage.getItem(DB_KEY)) || seed(); } catch (e) { db = seed(); }
const persist = () => sessionStorage.setItem(DB_KEY, JSON.stringify(db));
let ver = sessionStorage.getItem('part4_ver') || 'A';

const allUnits = () => db.groups.flatMap(g => g.units.map(u => ({ ...u, gname: g.name })));
const unitById = id => allUnits().find(u => u.id === id);
const orderedUnits = () => db.displayOrder.map(unitById).filter(Boolean);
const depLabel = d => d.way === 'prepay' ? '預先收款' : '信用卡授權綁定';
const condLabel = d => d.cond === 'people' ? `${d.minPeople} 人以上，每人 ${d.perPerson} 元` : `固定金額 ${d.fixed} 元/組`;

/* ── 側欄 ── */
const RAIL = ['預約', '排隊', '月曆', '顧客', '推播', '公告', '優惠券', '設定'];
const navItems = () => {
  const base = ['預約規則', '例外預約規則', '自動排位規則', '顧客預約頁', '後台操作偏好', '預約通知', '預約追蹤', '訂金管理', '自訂預約問卷', '透過Google預訂'];
  if (ver === 'A') { const a = base.slice(); a.splice(2, 0, '臨時預約關閉設定'); return a; }
  return base; // B 收進例外預約規則、C 收進時間軸，側欄都不增項
};
const NAV = () => [
  ['帳號設定', ['商家基本資訊', '肚肚POS串接設定', '通知點數管理']],
  ['預約設定', navItems()],
  ['排隊設定', ['線上排隊設定', '排隊組別', '排隊通知']],
];
function renderChrome() {
  const inBook = location.hash === '#/timeline';
  $('#railList').innerHTML = RAIL.map(n =>
    `<div class="nav-item${(inBook ? n === '預約' : n === '設定') ? ' active' : ''}" data-rail="${n}"><span>${n}</span></div>`).join('');
  document.querySelectorAll('[data-rail]').forEach(el => el.addEventListener('click', () => {
    if (el.dataset.rail === '預約') {
      if (ver !== 'C') return toast('版本 C 才把臨時關閉做進預約檢視，先切到 C');
      location.hash = '#/timeline';
    } else if (el.dataset.rail === '設定') location.hash = '#/auto';
    else toast('此區不在 Part 4 範圍');
  }));
  const cur = { '#/auto': '自動排位規則', '#/deposit': '訂金管理', '#/closure': '臨時預約關閉設定', '#/exception': '例外預約規則' }[location.hash] || (inBook ? '' : '自動排位規則');
  $('#settingsNav').innerHTML = NAV().map(([g, items]) => `
    <div><div class="nav-group-title"><span class="dot"></span>${g}</div>
    <div class="nav-sub">${items.map(i => `<a data-nav="${esc(i)}" class="${i === cur ? 'active' : ''}">${esc(i)}</a>`).join('')}</div></div>`).join('');
  document.querySelectorAll('[data-nav]').forEach(a => a.addEventListener('click', () => {
    const n = a.dataset.nav;
    if (n === '自動排位規則') location.hash = '#/auto';
    else if (n === '訂金管理') location.hash = '#/deposit';
    else if (n === '臨時預約關閉設定') location.hash = '#/closure';
    else if (n === '例外預約規則') location.hash = '#/exception';
    else toast('此頁不在 Part 4 範圍，未做成 Demo');
  }));
  document.querySelectorAll('[data-ver]').forEach(b => {
    b.classList.toggle('on', b.dataset.ver === ver);
    b.onclick = () => {
      ver = b.dataset.ver; sessionStorage.setItem('part4_ver', ver);
      const onClosure = ['#/closure', '#/exception', '#/timeline'].includes(location.hash);
      if (onClosure) location.hash = { A: '#/closure', B: '#/exception', C: '#/timeline' }[ver];
      route();
    };
  });
}
function setTitle(crumb, h1) { $('#crumb').textContent = crumb; $('#pageH1').textContent = h1; }

/* ── 頁：自動排位規則（US4-1） ── */
function viewAuto() {
  setTitle('設定 / 預約設定', '自動排位規則');
  $('#content').innerHTML = `
    <div class="vnote">兩版相同。此頁的順序<b>只決定「同分時選誰」</b>——系統先求「用最少的預約單位滿足人數」，再看群組順序、再看群組內單位順序。與「後台操作偏好 &gt; 預約單位排序」（扁平、可跨群組）是兩套獨立排序。</div>
    <div class="card">
      <div class="card-head"><div class="ch-main">
        <div class="ch-title">優先排位順序</div>
        <div class="ch-desc">拖曳以調整順序。群組可整組移動；單位只能在所屬群組內排序，不可跨組。</div>
      </div></div>
      <div id="autoList" style="display:flex;flex-direction:column;gap:10px"></div>
      <div class="btn-row" style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn-md ghost" id="autoReset">還原預設順序</button>
        <button class="btn-md primary" id="autoSave">儲存</button>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><div class="ch-main">
        <div class="ch-title">演算法判斷順序</div>
        <div class="ch-desc">建立／修改線上預約，以及「自動分配預約單位」開啟時的自建預約，皆適用。</div>
      </div></div>
      <div style="font-size:14px;line-height:22px;color:var(--text-body)">
        1. 優先考慮：如何使用<b>最少</b>的預約單位滿足預約人數需求<br>
        2. 再考慮：群組的排列順序<br>
        3. 再考慮：群組內單位的排列順序
      </div>
    </div>`;
  renderAutoList();
  $('#autoSave').onclick = () => { persist(); toast('已儲存排位順序'); };
  $('#autoReset').onclick = () => { db.groups = seed().groups; persist(); renderAutoList(); toast('已還原預設順序'); };
}
function renderAutoList() {
  $('#autoList').innerHTML = db.groups.map((g, gi) => `
    <div class="gblock" draggable="true" data-gi="${gi}">
      <div class="gbhead"><span class="grip">⣿</span><span class="gchip">${esc(g.name)}</span>
        <span class="gborder">第 ${gi + 1} 順位・${g.units.length} 個單位</span></div>
      ${g.units.map((u, ui) => `
        <div class="srow drag" draggable="true" data-gi="${gi}" data-ui="${ui}">
          <span class="grip">⣿</span><span class="sname">${esc(u.name)}</span>
          <span class="scap mono">${esc(u.cap)} 人</span>
        </div>`).join('')}
    </div>`).join('');
  wireAutoDnd();
}
function wireAutoDnd() {
  let src = null;
  document.querySelectorAll('#autoList .srow').forEach(el => {
    el.addEventListener('dragstart', e => { e.stopPropagation(); src = el; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => { src = null; document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); renderAutoList(); });
    el.addEventListener('dragover', e => {
      if (!src || !src.classList.contains('srow')) return;
      e.preventDefault(); e.stopPropagation();
      if (src.dataset.gi !== el.dataset.gi) { el.classList.remove('over'); return; }
      el.classList.add('over');
    });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      if (!src || src.dataset.gi !== el.dataset.gi) { toast('不可跨群組排序'); return; }
      const g = db.groups[+el.dataset.gi];
      const [m] = g.units.splice(+src.dataset.ui, 1);
      g.units.splice(+el.dataset.ui, 0, m);
      persist();
    });
  });
  document.querySelectorAll('#autoList .gblock').forEach(el => {
    el.addEventListener('dragstart', e => { if (src) return; src = el; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => { src = null; renderAutoList(); });
    el.addEventListener('dragover', e => { if (src && src.classList.contains('gblock') && src !== el) { e.preventDefault(); el.classList.add('over'); } });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      if (!src || !src.classList.contains('gblock')) return;
      const [m] = db.groups.splice(+src.dataset.gi, 1);
      db.groups.splice(+el.dataset.gi, 0, m);
      persist();
    });
  });
}

/* ── 頁：訂金管理（US4-2） ── */
function viewDeposit() {
  setTitle('設定 / 預約設定', '訂金管理');
  $('#content').innerHTML = `
    <div class="vnote">兩版相同。相對現況的改動：原本這頁只有<b>一組</b>「收款方式＋收款條件」，改成可建立<b>多組具名的訂金規則</b>，供時段規則、例外時段規則與服務選項套用。套用優先序：<b>服務選項 &gt; 時段規則</b>；服務選項未設定訂金即為不收，不回落店家層級。</div>
    <div class="card">
      <div class="card-head"><div class="ch-main">
        <div class="ch-title">訂金預約模式</div>

/* ── 版本 C：把臨時關閉做進預約檢視 ── */
const T0 = 11, T1 = 23, SLOT = 30;                       // 11:00–23:00，每格 30 分
const COLS = (T1 - T0) * 60 / SLOT;
const colTime = i => { const m = T0 * 60 + i * SLOT; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const timeCol = t => { const [h, m] = t.split(':').map(Number); return (h * 60 + m - T0 * 60) / SLOT; };
let cView = 'timeline';
let sel = null;      // {r0,c0,r1,c1} 進行中或已完成的框選
let dragging = false; // ⚠️ 必須放在模組層：每次框選都會 route() 重繪並重新 wire，
                      // 放在 wireTimeline 內的話 mousedown 後就被重置成 false，拖不動

function closedSet(date) {
  const m = {};
  db.closures.filter(c => c.date === date).forEach(c => {
    c.unitIds.forEach(uid => {
      for (let i = timeCol(c.start); i < timeCol(c.end); i++) (m[uid] = m[uid] || new Set()).add(i);
    });
  });
  return m;
}
function viewTimeline() {
  setTitle('預約', '');
  const units = orderedUnits();
  const closed = closedSet(clDate);
  const nClosure = db.closures.length;
  const rect = sel ? { r0: Math.min(sel.r0, sel.r1), r1: Math.max(sel.r0, sel.r1), c0: Math.min(sel.c0, sel.c1), c1: Math.max(sel.c0, sel.c1) } : null;
  const grid = `
    <div class="tlwrap"><div class="tlgrid" id="tlGrid" style="grid-template-columns:120px repeat(${COLS},44px)">
      <div class="tlh" style="position:sticky;left:0;z-index:3">組別／桌次</div>
      ${Array.from({ length: COLS }, (_, i) => `<div class="tlh">${i % 2 === 0 ? colTime(i) : ''}</div>`).join('')}
      ${units.map((u, r) => `
        <div class="tlu"><span class="gchip">${esc(u.gname)}</span><b>${esc(u.name)}</b></div>
        ${Array.from({ length: COLS }, (_, c) => {
          const isClosed = closed[u.id] && closed[u.id].has(c);
          const inSel = rect && r >= rect.r0 && r <= rect.r1 && c >= rect.c0 && c <= rect.c1;
          const bk = db.bookings.find(b => b.unitId === u.id && timeCol(b.start) === c);
          return `<div class="tlc${c % 2 ? ' half' : ''}${isClosed ? ' closed' : ''}${inSel ? ' sel' : ''}" data-r="${r}" data-c="${c}">${
            bk ? `<div class="tlbk" style="width:${bk.dur / SLOT * 44 - 2}px">${esc(bk.name)}</div>` : ''}</div>`;
        }).join('')}`).join('')}
    </div></div>`;
  const selInfo = rect ? (() => {
    const names = units.slice(rect.r0, rect.r1 + 1).map(u => u.name).join('、');
    const t = colTime(rect.c0) + '–' + colTime(rect.c1 + 1);
    const allClosed = units.slice(rect.r0, rect.r1 + 1).every(u => {
      for (let c = rect.c0; c <= rect.c1; c++) if (!(closed[u.id] && closed[u.id].has(c))) return false;
      return true;
    });
    return `<div class="selbar">
      <span>已選 <b>${names}</b>　<span class="mono">${t}</span></span>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn-md ghost" id="selCancel">取消</button>
        <button class="btn-md ${allClosed ? 'ghost-green' : 'primary'}" id="selDo">${allClosed ? '恢復開放線上預約' : '關閉線上預約'}</button>
      </div></div>`;
  })() : '';
  $('#content').innerHTML = `
    <div class="vnote"><b>版本 C・檢視內操作</b>：側欄不增項、不做設定頁。<b>在時間軸上直接框選「桌 × 時段」</b>就能關閉，操作列只在選取時出現、平時不佔版面。右上角的「臨時關閉」chip 是跨日期的總覽與解除入口，補上時間軸一次只看一天、容易忘記恢復的缺口。空間圖與清單只呈現狀態、不做關閉操作——它們沒有「單位 × 時間」兩個軸，硬做就得補問時段，反而比設定頁還笨。</div>
    <div class="bkbar">
      <span class="date mono">${clDate}</span>
      ${nClosure ? `<span class="chip-cl" id="clChip">● 臨時關閉 ${nClosure}</span>` : ''}
      <div class="bkviews">
        ${[['timeline', '時間軸'], ['space', '空間圖'], ['list', '清單']].map(([v, n]) =>
          `<a data-cv="${v}" class="${cView === v ? 'on' : ''}">${n}</a>`).join('')}
      </div>
    </div>
    ${cView === 'timeline' ? grid + selInfo : cView === 'space' ? spaceMap(closed) : listView(closed)}`;
  document.querySelectorAll('[data-cv]').forEach(a => a.onclick = () => { cView = a.dataset.cv; sel = null; route(); });
  const chip = $('#clChip'); if (chip) chip.onclick = openClosureDrawer;
  if (cView === 'timeline') wireTimeline(units, closed, rect);
}
function wireTimeline(units, closed, rect) {
  const g = $('#tlGrid');
  // 先看 e.target（拖曳中滑鼠底下的元素會冒泡上來），沒有再用座標反查
  const cellOf = e => {
    const t = e.target && e.target.closest ? e.target.closest('.tlc') : null;
    if (t) return t;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    return el && el.closest ? el.closest('.tlc') : null;
  };
  g.addEventListener('mousedown', e => {
    const c = e.target.closest('.tlc'); if (!c) return;
    e.preventDefault(); dragging = true;
    sel = { r0: +c.dataset.r, c0: +c.dataset.c, r1: +c.dataset.r, c1: +c.dataset.c };
    route();
  });
  window.onmousemove = e => {
    if (!dragging) return;
    const c = cellOf(e); if (!c) return;
    if (+c.dataset.r === sel.r1 && +c.dataset.c === sel.c1) return;
    sel.r1 = +c.dataset.r; sel.c1 = +c.dataset.c; route();
  };
  window.onmouseup = () => { dragging = false; };
  const cancel = $('#selCancel'); if (cancel) cancel.onclick = () => { sel = null; route(); };
  const doBtn = $('#selDo');
  if (doBtn) doBtn.onclick = () => {
    const start = colTime(rect.c0), end = colTime(rect.c1 + 1);
    const ids = units.slice(rect.r0, rect.r1 + 1).map(u => u.id);
    const allClosed = ids.every(id => { for (let c = rect.c0; c <= rect.c1; c++) if (!(closed[id] && closed[id].has(c))) return false; return true; });
    if (allClosed) {
      // 恢復：把落在選取範圍內的關閉切掉（示意版直接移除整筆同範圍設定）
      db.closures = db.closures.filter(c => !(c.date === clDate && timeCol(c.start) >= rect.c0 && timeCol(c.end) <= rect.c1 + 1 && c.unitIds.some(id => ids.includes(id))));
      toast('已恢復開放');
    } else {
      db.closures.push({ id: 'c' + (++db.seq), date: clDate, start, end, unitIds: ids });
      toast(`已關閉線上預約：${ids.length} 個單位 ${start}–${end}`);
    }
    sel = null; persist(); route();
  };
}
function spaceMap(closed) {
  return `<div class="tlwrap"><div class="sp-map">
    ${orderedUnits().map(u => `<div class="sp-t${closed[u.id] ? ' closed' : ''}">
      <b>${esc(u.name)}</b><small>${closed[u.id] ? '已臨時關閉' : esc(u.cap) + ' 人'}</small></div>`).join('')}
  </div></div>`;
}
function listView(closed) {
  const withClosed = orderedUnits().filter(u => closed[u.id]);
  return `<div class="tlwrap" style="padding:18px;display:flex;flex-direction:column;gap:10px">
    ${db.bookings.map(b => `<div class="cl-item"><span class="mono">${b.start}</span>
      <span class="sname">${esc(b.name)}</span>
      <span class="gchip">${esc((unitById(b.unitId) || {}).name || '')}</span></div>`).join('')}
    ${withClosed.length ? `<div style="font-size:13px;color:var(--text-muted);margin-top:6px">本日已臨時關閉：${withClosed.map(u => esc(u.name)).join('、')}</div>` : ''}
  </div>`;
}
function openClosureDrawer() {
  const byDate = {};
  db.closures.forEach(c => (byDate[c.date] = byDate[c.date] || []).push(c));
  $('#drPanel').innerHTML = `
    <div class="dr-hd">臨時關閉中<span style="margin-left:auto"><button class="btn-md ghost" id="drClose">關閉</button></span></div>
    <div class="dr-bd">
      <div class="vnote">時間軸一次只看一天，這裡列出<b>所有日期</b>的關閉設定——避免關了忘記恢復，線上預約被默默擋住。</div>
      ${Object.keys(byDate).sort().map(d => `
        <div><div class="dr-day mono">${d}${d === clDate ? '（今天檢視中）' : ''}</div>
          <div class="hist">${byDate[d].map(c => `
            <div class="hist-row">
              <div><span class="mono">${c.start}–${c.end}</span><br>${c.unitIds.map(id => esc((unitById(id) || {}).name || '')).join('、')}</div>
              <span class="x" data-drx="${c.id}">解除</span>
            </div>`).join('')}</div></div>`).join('') || '<div class="empty">目前沒有臨時關閉的單位</div>'}
    </div>`;
  $('#drMask').classList.add('show'); $('#drPanel').classList.add('show');
  $('#drClose').onclick = closeDrawer;
  document.querySelectorAll('[data-drx]').forEach(x => x.onclick = () => {
    db.closures = db.closures.filter(c => c.id !== x.dataset.drx); persist(); route(); openClosureDrawer(); toast('已解除關閉');
  });
}
const closeDrawer = () => { $('#drMask').classList.remove('show'); $('#drPanel').classList.remove('show'); };
$('#drMask').addEventListener('click', closeDrawer);

/* ── Router ── */
function route() {
  renderChrome();
  const h = location.hash || '#/auto';
  const closureView = () => ({ A: viewClosureA, B: () => viewExceptionB('closure'), C: viewTimeline }[ver])();
  if (h === '#/deposit') viewDeposit();
  else if (h === '#/closure' || h === '#/exception' || h === '#/timeline') closureView();
  else viewAuto();
}
window.addEventListener('hashchange', route);
$('#resetBtn').onclick = () => { db = seed(); persist(); toast('已重置範例資料'); route(); };
if (!location.hash) location.hash = '#/auto';
route();
</script>
