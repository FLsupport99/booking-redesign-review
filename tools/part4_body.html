<style>
/* ── Part4 專用（其餘 token 與元件沿用 sim.html） ── */
.vsw{position:fixed;top:12px;right:16px;z-index:300;display:flex;gap:0;background:#fff;border:1px solid var(--border-field);border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.vsw button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;font-family:var(--font)}
.vsw button.on{background:var(--primary);color:#fff}
.vnote{background:var(--primary-l3);border:1px solid var(--border-tag-on);border-radius:var(--r-card);padding:12px 16px;font-size:13px;line-height:19px;color:var(--text-body)}
.vnote b{color:var(--text-strong)}
.srow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border-card);border-radius:var(--r-input);padding:10px 14px}
.srow.drag{cursor:grab;user-select:none}
.srow.dragging{opacity:.4}
.srow.over{border-color:var(--border-on);background:var(--bg-selected)}
.grip{width:14px;color:var(--text-disabled);letter-spacing:-2px;line-height:1;font-size:15px}
.gchip{font-size:12px;line-height:16px;padding:2px 8px;border-radius:var(--r-tag);background:var(--bg-tag-on);color:var(--text-body);white-space:nowrap}
.sname{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scap{font-size:13px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.gblock{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--border-field);border-radius:var(--r-card);padding:10px}
.gblock.dragging{opacity:.4}
.gblock.over{border-color:var(--border-on)}
.gbhead{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:grab;user-select:none}
.gborder{font-size:12px;color:var(--text-muted);margin-left:auto;font-variant-numeric:tabular-nums}
.dep-card{border:1px solid var(--border-card);border-radius:var(--r-card);padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.dep-card .dc-main{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.dc-name{font-size:15px;font-weight:500}
.dc-meta{font-size:13px;line-height:19px;color:var(--text-body)}
.dc-used{font-size:12px;color:var(--text-muted)}
.sw{width:40px;height:22px;border-radius:999px;background:var(--btn-disabled);position:relative;cursor:pointer;flex:none;transition:background .15s}

.sw.on::after{left:20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-card);margin-bottom:4px}
.tabs a{padding:10px 14px;font-size:14px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.cl-grid{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
@media(max-width:900px){.cl-grid{grid-template-columns:1fr}}
.cl-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r-input);border:1px solid var(--border-card)}
.cl-item.off{background:#faf7f7;border-color:#f0dede}
.cl-item.off .sname{color:var(--text-muted);text-decoration:line-through}
.hist{display:flex;flex-direction:column;gap:6px}
.hist-row{border:1px solid var(--border-card);border-radius:var(--r-input);padding:10px 12px;font-size:13px;line-height:19px;display:flex;gap:8px;align-items:flex-start}
.hist-row .x{margin-left:auto;color:var(--alert);cursor:pointer;font-size:12px;white-space:nowrap}

/* sim.html 的選取態綁在 .opt-row.on 上，這裡的單選直接掛在 .radio 自己 */

#modalBox{width:560px}
.inline2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.inline2 .input{width:auto}
.w80{width:80px}
.w110{width:110px}
</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
function openModal(html) { $('#modalBox').innerHTML = html; $('#modalMask').classList.add('show'); }
function closeModal() { $('#modalMask').classList.remove('show'); }
$('#modalMask').addEventListener('click', e => { if (e.target === $('#modalMask')) closeModal(); });

/* ── 假資料 ── */
const DB_KEY = 'part4_v1';
const seed = () => ({
  groups: [
    { id: 'g1', name: 'B區', units: [
      { id: 'u1', name: 'B1', cap: '1~2' }, { id: 'u2', name: 'B2', cap: '1~2' },
      { id: 'u3', name: 'B3', cap: '1~2' }, { id: 'u4', name: 'B4', cap: '1~2' }] },
    { id: 'g2', name: '戶外', units: [
      { id: 'u5', name: 'D1', cap: '1~4' }, { id: 'u6', name: 'D2', cap: '1~4' }] },
    { id: 'g3', name: '室內', units: [
      { id: 'u7', name: 'C1', cap: '1~4' }, { id: 'u8', name: 'C2', cap: '1~4' },
      { id: 'u9', name: 'C3', cap: '3~4' }] },
  ],
  // 時間軸顯示排序（來自「後台操作偏好 > 預約單位排序」，扁平、可跨群組）— 臨時關閉清單依此排
  displayOrder: ['u1', 'u2', 'u5', 'u6', 'u3', 'u4', 'u7', 'u8', 'u9'],
  depositOn: true,
  merchantNo: 'MNU00',   // 示意值，非真實商店代號
  deposits: [
    { id: 'd1', name: '假日訂位訂金', way: 'prepay', cond: 'people', minPeople: 1, perPerson: 100, fixed: 200, usedBy: ['假日時段規則', '例外：中秋連假'] },
    { id: 'd2', name: '包廂綁卡', way: 'auth', cond: 'fixed', minPeople: 4, perPerson: 100, fixed: 1000, usedBy: ['服務選項：包廂'] },
  ],
  closures: [
    { id: 'c1', date: '2026-08-14', start: '18:00', end: '20:00', unitIds: ['u1', 'u2'] },
  ],
  seq: 3,
});
let db;
try { db = JSON.parse(sessionStorage.getItem(DB_KEY)) || seed(); } catch (e) { db = seed(); }
const persist = () => sessionStorage.setItem(DB_KEY, JSON.stringify(db));
let ver = sessionStorage.getItem('part4_ver') || 'A';

const allUnits = () => db.groups.flatMap(g => g.units.map(u => ({ ...u, gname: g.name })));
const unitById = id => allUnits().find(u => u.id === id);
const orderedUnits = () => db.displayOrder.map(unitById).filter(Boolean);
const depLabel = d => d.way === 'prepay' ? '預先收款' : '信用卡授權綁定';
const condLabel = d => d.cond === 'people' ? `${d.minPeople} 人以上，每人 ${d.perPerson} 元` : `固定金額 ${d.fixed} 元/組`;

/* ── 側欄 ── */
const RAIL = ['預約', '排隊', '月曆', '顧客', '推播', '公告', '優惠券', '設定'];
const navItems = () => {
  const base = ['預約規則', '例外預約規則', '自動排位規則', '顧客預約頁', '後台操作偏好', '預約通知', '預約追蹤', '訂金管理', '自訂預約問卷', '透過Google預訂'];
  if (ver === 'A') { const a = base.slice(); a.splice(2, 0, '臨時預約關閉設定'); return a; }
  return base;
};
const NAV = () => [
  ['帳號設定', ['商家基本資訊', '肚肚POS串接設定', '通知點數管理']],
  ['預約設定', navItems()],
  ['排隊設定', ['線上排隊設定', '排隊組別', '排隊通知']],
];
function renderChrome() {
  $('#railList').innerHTML = RAIL.map(n =>
    `<div class="nav-item${n === '設定' ? ' active' : ''}"><span>${n}</span></div>`).join('');
  const cur = { '#/auto': '自動排位規則', '#/deposit': '訂金管理', '#/closure': '臨時預約關閉設定', '#/exception': '例外預約規則' }[location.hash] || '自動排位規則';
  $('#settingsNav').innerHTML = NAV().map(([g, items]) => `
    <div><div class="nav-group-title"><span class="dot"></span>${g}</div>
    <div class="nav-sub">${items.map(i => `<a data-nav="${esc(i)}" class="${i === cur ? 'active' : ''}">${esc(i)}</a>`).join('')}</div></div>`).join('');
  document.querySelectorAll('[data-nav]').forEach(a => a.addEventListener('click', () => {
    const n = a.dataset.nav;
    if (n === '自動排位規則') location.hash = '#/auto';
    else if (n === '訂金管理') location.hash = '#/deposit';
    else if (n === '臨時預約關閉設定') location.hash = '#/closure';
    else if (n === '例外預約規則') location.hash = '#/exception';
    else toast('此頁不在 Part 4 範圍，未做成 Demo');
  }));
  document.querySelectorAll('[data-ver]').forEach(b => {
    b.classList.toggle('on', b.dataset.ver === ver);
    b.onclick = () => {
      ver = b.dataset.ver; sessionStorage.setItem('part4_ver', ver);
      if (ver === 'A' && location.hash === '#/exception') location.hash = '#/closure';
      if (ver === 'B' && location.hash === '#/closure') location.hash = '#/exception';
      route();
    };
  });
}
function setTitle(crumb, h1) { $('#crumb').textContent = crumb; $('#pageH1').textContent = h1; }

/* ── 頁：自動排位規則（US4-1） ── */
function viewAuto() {
  setTitle('設定 / 預約設定', '自動排位規則');
  $('#content').innerHTML = `
    <div class="vnote">兩版相同。此頁的順序<b>只決定「同分時選誰」</b>——系統先求「用最少的預約單位滿足人數」，再看群組順序、再看群組內單位順序。與「後台操作偏好 &gt; 預約單位排序」（扁平、可跨群組）是兩套獨立排序。</div>
    <div class="card">
      <div class="card-head"><div class="ch-main">
        <div class="ch-title">優先排位順序</div>
        <div class="ch-desc">拖曳以調整順序。群組可整組移動；單位只能在所屬群組內排序，不可跨組。</div>
      </div></div>
      <div id="autoList" style="display:flex;flex-direction:column;gap:10px"></div>
      <div class="btn-row" style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn-md ghost" id="autoReset">還原預設順序</button>
        <button class="btn-md primary" id="autoSave">儲存</button>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><div class="ch-main">
        <div class="ch-title">演算法判斷順序</div>
        <div class="ch-desc">建立／修改線上預約，以及「自動分配預約單位」開啟時的自建預約，皆適用。</div>
      </div></div>
      <div style="font-size:14px;line-height:22px;color:var(--text-body)">
        1. 優先考慮：如何使用<b>最少</b>的預約單位滿足預約人數需求<br>
        2. 再考慮：群組的排列順序<br>
        3. 再考慮：群組內單位的排列順序
      </div>
    </div>`;
  renderAutoList();
  $('#autoSave').onclick = () => { persist(); toast('已儲存排位順序'); };
  $('#autoReset').onclick = () => { db.groups = seed().groups; persist(); renderAutoList(); toast('已還原預設順序'); };
}
function renderAutoList() {
  $('#autoList').innerHTML = db.groups.map((g, gi) => `
    <div class="gblock" draggable="true" data-gi="${gi}">
      <div class="gbhead"><span class="grip">⣿</span><span class="gchip">${esc(g.name)}</span>
        <span class="gborder">第 ${gi + 1} 順位・${g.units.length} 個單位</span></div>
      ${g.units.map((u, ui) => `
        <div class="srow drag" draggable="true" data-gi="${gi}" data-ui="${ui}">
          <span class="grip">⣿</span><span class="sname">${esc(u.name)}</span>
          <span class="scap mono">${esc(u.cap)} 人</span>
        </div>`).join('')}
    </div>`).join('');
  wireAutoDnd();
}
function wireAutoDnd() {
  let src = null;
  document.querySelectorAll('#autoList .srow').forEach(el => {
    el.addEventListener('dragstart', e => { e.stopPropagation(); src = el; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => { src = null; document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); renderAutoList(); });
    el.addEventListener('dragover', e => {
      if (!src || !src.classList.contains('srow')) return;
      e.preventDefault(); e.stopPropagation();
      if (src.dataset.gi !== el.dataset.gi) { el.classList.remove('over'); return; }
      el.classList.add('over');
    });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      if (!src || src.dataset.gi !== el.dataset.gi) { toast('不可跨群組排序'); return; }
      const g = db.groups[+el.dataset.gi];
      const [m] = g.units.splice(+src.dataset.ui, 1);
      g.units.splice(+el.dataset.ui, 0, m);
      persist();
    });
  });
  document.querySelectorAll('#autoList .gblock').forEach(el => {
    el.addEventListener('dragstart', e => { if (src) return; src = el; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => { src = null; renderAutoList(); });
    el.addEventListener('dragover', e => { if (src && src.classList.contains('gblock') && src !== el) { e.preventDefault(); el.classList.add('over'); } });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      if (!src || !src.classList.contains('gblock')) return;
      const [m] = db.groups.splice(+src.dataset.gi, 1);
      db.groups.splice(+el.dataset.gi, 0, m);
      persist();
    });
  });
}

/* ── 頁：訂金管理（US4-2） ── */
function viewDeposit() {
  setTitle('設定 / 預約設定', '訂金管理');
  $('#content').innerHTML = `
    <div class="vnote">兩版相同。相對現況的改動：原本這頁只有<b>一組</b>「收款方式＋收款條件」，改成可建立<b>多組具名的訂金規則</b>，供時段規則、例外時段規則與服務選項套用。套用優先序：<b>服務選項 &gt; 時段規則</b>；服務選項未設定訂金即為不收，不回落店家層級。</div>
    <div class="card">
      <div class="card-head"><div class="ch-main">
        <div class="ch-title">訂金預約模式</div>
        <div class="ch-desc">開啟後，所有符合條件且透過線上預約的顧客都必須在期限內完成付款或授權信用卡。</div>
      </div><div class="sw${db.depositOn ? ' on' : ''}" id="depSw"></div></div>
      <div style="font-size:14px;color:var(--text-body)">藍新商店代號　<b class="mono">${esc(db.merchantNo)}</b></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="ch-main">
        <div class="ch-title">訂金規則</div>
        <div class="ch-desc">建立後可在「預約時段設定」「例外預約日期設定」「服務選項設定」中選用。依建立時間排序。</div>
      </div><button class="btn-md ghost-green" id="depAdd">＋ 新增訂金規則</button></div>
      <div id="depList" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="ch-main"><div class="ch-title">期限與請款規則（沿用現況、不可調整）</div></div></div>
      <div style="font-size:14px;line-height:22px;color:var(--text-body)">
        ・預先收款的付款期限：送出預約申請後至<b>隔日 22:59</b>；若預約時間為送出當日或隔日，期限改為<b>預約時間前 30 分鐘</b><br>
        ・信用卡授權的操作期限：送出預約申請後 <b>30 分鐘</b>內，逾時未授權自動取消預約<br>
        ・授權完成後僅保留額度、不自動扣款；<b>「請款」按鈕僅在預約狀態為「未到店」時出現</b><br>
        ・請款期限：<b>預約日後七日內</b>，逾期授權失效且無法再扣款<br>
        ・逾時未付款／未授權：預約自動轉入「取消預約」
      </div>
    </div>`;
  renderDepList();
  $('#depSw').onclick = () => { db.depositOn = !db.depositOn; persist(); viewDeposit(); };
  $('#depAdd').onclick = () => depForm(null);
}
function renderDepList() {
  $('#depList').innerHTML = db.deposits.length ? db.deposits.map(d => `
    <div class="dep-card">
      <div class="dc-main">
        <div class="dc-name">${esc(d.name)}</div>
        <div class="dc-meta">收款方式：${depLabel(d)}　｜　收款條件：${condLabel(d)}</div>
        <div class="dc-used">${d.usedBy.length ? '套用中：' + d.usedBy.map(esc).join('、') : '尚未被套用'}</div>
      </div>
      <button class="btn-md ghost" data-dedit="${d.id}">編輯</button>
      <button class="btn-md ghost-red" data-ddel="${d.id}">刪除</button>
    </div>`).join('') : `<div class="empty">目前沒有任何訂金規則</div>`;
  document.querySelectorAll('[data-dedit]').forEach(b => b.onclick = () => depForm(db.deposits.find(d => d.id === b.dataset.dedit)));
  document.querySelectorAll('[data-ddel]').forEach(b => b.onclick = () => depDelete(db.deposits.find(d => d.id === b.dataset.ddel)));
}
function depForm(d) {
  const f = d ? { ...d } : { id: 'd' + (++db.seq), name: '訂金規則 ' + (db.deposits.length + 1), way: 'prepay', cond: 'people', minPeople: 1, perPerson: 100, fixed: 200, usedBy: [] };
  const draw = () => {
    openModal(`
      <h3>${d ? '編輯' : '新增'}訂金規則</h3>
      <div class="m-body">
        <div class="field"><span class="field-label">訂金規則名稱</span>
          <input class="input" id="fName" value="${esc(f.name)}" placeholder="訂金規則 1">
          <span class="hint">名稱不得重複</span></div>
        <div class="field"><span class="field-label">收款方式</span>
          <div class="rows" style="display:flex;flex-direction:column;gap:8px">
            ${[['prepay', '預先收款', '顧客可透過轉帳、信用卡、超商代碼完成訂金支付'],
               ['auth', '信用卡授權綁定', '顧客需完成信用卡授權，若因故爽約，可於授權期限內請款']]
              .map(([v, n, sub]) => `<label class="check" data-way="${v}"><span class="radio"${f.way === v ? ' data-on' : ''}></span>
                <span><span class="ck-label">${n}</span><div class="ck-desc">${sub}</div></span></label>`).join('')}
          </div></div>
        <div class="field"><span class="field-label">收款條件</span>
          <div class="rows" style="display:flex;flex-direction:column;gap:10px">
            <label class="check" data-cond="people"><span class="radio"${f.cond === 'people' ? ' data-on' : ''}></span>
              <span class="inline2">依據預約人數
                <input class="input w80 mono" id="fMin" value="${f.minPeople}"> 人以上，
                <input class="input w80 mono" id="fPer" value="${f.perPerson}"> 元/人</span></label>
            <label class="check" data-cond="fixed"><span class="radio"${f.cond === 'fixed' ? ' data-on' : ''}></span>
              <span class="inline2">固定金額
                <input class="input w110 mono" id="fFix" value="${f.fixed}"> 元/組</span></label>
          </div>
          <span class="hint">人數計算包含大人與小孩。不適用於 Google 預訂；自建預約由店員逐筆輸入金額。</span></div>
      </div>
      <div class="btn-row" style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn-md ghost" id="fCancel">取消</button>
        <button class="btn-md primary" id="fSave">儲存</button>
      </div>`);
    document.querySelectorAll('[data-way]').forEach(el => el.onclick = () => { grab(); f.way = el.dataset.way; draw(); });
    document.querySelectorAll('[data-cond]').forEach(el => el.onclick = e => {
      if (e.target.tagName === 'INPUT') return; grab(); f.cond = el.dataset.cond; draw();
    });
    $('#fCancel').onclick = closeModal;
    $('#fSave').onclick = () => {
      grab();
      if (!f.name.trim()) return toast('請輸入訂金規則名稱');
      if (db.deposits.some(x => x.name.trim() === f.name.trim() && x.id !== f.id)) return toast('名稱不得重複');
      const i = db.deposits.findIndex(x => x.id === f.id);
      if (i >= 0) db.deposits[i] = f; else db.deposits.push(f);
      persist(); closeModal(); renderDepList(); toast('已儲存');
    };
  };
  const grab = () => {
    f.name = $('#fName').value;
    f.minPeople = +$('#fMin').value || 1; f.perPerson = +$('#fPer').value || 0; f.fixed = +$('#fFix').value || 0;
  };
  draw();
}
function depDelete(d) {
  openModal(`
    <h3>刪除訂金規則</h3>
    <div class="m-body">
      確定要刪除「${esc(d.name)}」嗎？
      ${d.usedBy.length ? `<div class="vnote">此規則目前被 <b>${d.usedBy.length}</b> 個規則套用中：${d.usedBy.map(esc).join('、')}。<br>刪除後這些規則會變成<b>「不需要訂金」</b>。已處於「待付款/綁卡」的既有預約不受影響。</div>` : ''}
    </div>
    <div class="btn-row" style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-md ghost" id="dCancel">取消</button>
      <button class="btn-md ghost-red" id="dOk">刪除</button>
    </div>`);
  $('#dCancel').onclick = closeModal;
  $('#dOk').onclick = () => { db.deposits = db.deposits.filter(x => x.id !== d.id); persist(); closeModal(); renderDepList(); toast('已刪除'); };
}

/* ── 臨時預約關閉（US4-3）── A：獨立頁；B：例外預約規則的分頁 ── */
let clDate = '2026-08-14', clStart = '18:00', clEnd = '20:00';
const priorityCard = () => `
  <div class="card">
    <div class="card-head"><div class="ch-main">
      <div class="ch-title">規則判斷優先順序</div>
      <div class="ch-desc">同一天設定多種規則時，系統由上而下判斷。</div>
    </div></div>
    <div style="font-size:14px;line-height:22px;color:var(--text-body)">
      1. 整日不可預約　2. <b>臨時預約關閉</b>　3. 例外時段規則　4. 常態時段規則　5. 單位容納能力限制
    </div>
  </div>`;
function closureBlock() {
  const cur = db.closures.find(c => c.date === clDate && c.start === clStart && c.end === clEnd);
  const closed = new Set(cur ? cur.unitIds : []);
  return `
    <div class="card">
      <div class="card-head"><div class="ch-main">
        <div class="ch-title">選擇要關閉的時段</div>
        <div class="ch-desc">關閉後，該時段內的指定預約單位<b>不再開放線上預約</b>；已存在的預約不受影響，後台自建預約也不受限制。</div>
      </div></div>
      <div class="inline2">
        <input type="date" class="input" id="clDate" value="${clDate}" style="width:170px">
        <input type="time" class="input mono" id="clStart" value="${clStart}" style="width:120px">〜
        <input type="time" class="input mono" id="clEnd" value="${clEnd}" style="width:120px">
      </div>
    </div>
    <div class="cl-grid">
      <div class="card">
        <div class="card-head"><div class="ch-main">
          <div class="ch-title">預約單位</div>
          <div class="ch-desc">順序沿用「後台操作偏好 &gt; 預約單位排序」，與時間軸上看到的一致。</div>
        </div></div>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${orderedUnits().map(u => `
            <div class="cl-item${closed.has(u.id) ? ' off' : ''}">
              <span class="gchip">${esc(u.gname)}</span>
              <span class="sname">${esc(u.name)}</span>
              <span class="scap mono">${esc(u.cap)} 人</span>
              <span class="sw${closed.has(u.id) ? '' : ' on'}" data-cu="${u.id}"></span>
            </div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="ch-main"><div class="ch-title">目前的關閉設定</div></div></div>
        <div class="hist">
          ${db.closures.length ? db.closures.map(c => `
            <div class="hist-row">
              <div><b class="mono">${c.date}</b> <span class="mono">${c.start}–${c.end}</span><br>
                ${c.unitIds.map(id => esc((unitById(id) || {}).name || '')).join('、')}</div>
              <span class="x" data-clx="${c.id}">解除</span>
            </div>`).join('') : '<div class="empty">目前沒有臨時關閉的單位</div>'}
        </div>
      </div>
    </div>`;
}
function wireClosure() {
  ['clDate', 'clStart', 'clEnd'].forEach(id => {
    const el = $('#' + id); if (!el) return;
    el.onchange = () => { clDate = $('#clDate').value; clStart = $('#clStart').value; clEnd = $('#clEnd').value; route(); };
  });
  document.querySelectorAll('[data-cu]').forEach(sw => sw.onclick = () => {
    const uid = sw.dataset.cu;
    let c = db.closures.find(x => x.date === clDate && x.start === clStart && x.end === clEnd);
    if (!c) { c = { id: 'c' + (++db.seq), date: clDate, start: clStart, end: clEnd, unitIds: [] }; db.closures.push(c); }
    c.unitIds = c.unitIds.includes(uid) ? c.unitIds.filter(x => x !== uid) : c.unitIds.concat(uid);
    db.closures = db.closures.filter(x => x.unitIds.length);
    persist(); route();
    toast(c.unitIds.includes(uid) ? '已關閉線上預約' : '已恢復開放');
  });
  document.querySelectorAll('[data-clx]').forEach(x => x.onclick = () => {
    db.closures = db.closures.filter(c => c.id !== x.dataset.clx); persist(); route(); toast('已解除關閉');
  });
}
function viewClosureA() {
  setTitle('設定 / 預約設定', '臨時預約關閉設定');
  $('#content').innerHTML = `
    <div class="vnote"><b>版本 A・分散式</b>：側欄新增「臨時預約關閉設定」獨立頁，與「自動排位規則」「訂金管理」平行。優點是三個功能各自一頁、最貼近現況與既有 Settings 版型，改動最小；代價是側欄再長一項（預約設定已有 11 項）。優先層級卡片直接放進本頁，把版本 B 的優點吸收過來。</div>
    ${priorityCard()}
    ${closureBlock()}`;
  wireClosure();
}
function viewExceptionB(tab) {
  setTitle('設定 / 預約設定', '例外預約規則');
  const t = tab || 'closure';
  $('#content').innerHTML = `
    <div class="vnote"><b>版本 B・收斂式</b>：臨時關閉收進「例外預約規則」成為第三個分頁，側欄不增項。優點是四種例外規則同頁、與優先層級的心智模型一致（整日不可預約 &gt; 臨時關閉 &gt; 例外時段規則）；代價是既有的例外頁要重排成分頁結構，且「臨時」操作藏得比較深。</div>
    <div class="tabs">
      <a data-tab="allday" class="${t === 'allday' ? 'on' : ''}">整日不可預約</a>
      <a data-tab="exc" class="${t === 'exc' ? 'on' : ''}">例外時段規則</a>
      <a data-tab="closure" class="${t === 'closure' ? 'on' : ''}">臨時預約關閉</a>
    </div>
    ${priorityCard()}
    ${t === 'closure' ? closureBlock() : `<div class="card"><div class="empty">${t === 'allday' ? '「整日不可預約」為 Part 1 既有畫面，本 Demo 不重複實作' : '「例外時段規則」為 Part 1 既有畫面，本 Demo 不重複實作；Part 4 只在此新增「訂金規則」選擇器'}</div></div>`}`;
  document.querySelectorAll('[data-tab]').forEach(a => a.onclick = () => viewExceptionB(a.dataset.tab));
  if (t === 'closure') wireClosure();
}

/* ── Router ── */
function route() {
  renderChrome();
  const h = location.hash || '#/auto';
  if (h === '#/deposit') viewDeposit();
  else if (h === '#/closure') { ver === 'A' ? viewClosureA() : viewExceptionB('closure'); }
  else if (h === '#/exception') { ver === 'B' ? viewExceptionB('closure') : viewClosureA(); }
  else viewAuto();
}
window.addEventListener('hashchange', route);
$('#resetBtn').onclick = () => { db = seed(); persist(); toast('已重置範例資料'); route(); };
if (!location.hash) location.hash = '#/auto';
route();
</script>
