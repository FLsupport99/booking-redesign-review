<!doctype html>
<!-- Part4 整合版：由 tools/build_part4_timeline.py 從 sim.html 產生，請勿直接編輯 -->
<!-- 設定區依 Figma「2025 Oct. 系統架構演算法優化」；預約區依「2026 Jul. 預約系統操作優化」Part3 自建預約 -->
<!-- 資料層為 sessionStorage mock API，設定區與預約區共用同一份 db（改設定會直接影響預約區） -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part4 整合版（自訂排位順序）｜Part4 整合版｜MENU店+ 後台模擬器（時間軸臨時關閉）</title>
<style>
:root{
  --bg-page:#f9f9f9; --bg-surface:#fff; --bg-selected:#ecf8f3; --bg-tag-on:#d6f0e5;
  --border-card:#f0f0f0; --border-field:#dcdcdc; --border-on:#3fba88; --border-tag-on:#8cd6b8;
  --primary:#3fba88; --primary-dark:#29a379; --primary-l2:#d6f0e5; --primary-l3:#ecf8f3;
  --secondary:#4b9ac3; --emphasis:#f8ba4c; --emphasis-d:#ff991f; --alert:#ce4949; --alert-light:#ef6868;
  --text-strong:#333; --text-body:rgba(51,51,51,.75); --text-muted:rgba(51,51,51,.6); --text-disabled:rgba(51,51,51,.27);
  --icon-muted:#676767; --sidebar-bg:#333; --btn-disabled:#dcdcdc;
  --r-tag:4px; --r-nav:6px; --r-input:7px; --r-btn:8px; --r-card:12px;
  --font:"PingFang TC","PingFang SC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:#e9eaec;color:var(--text-strong);-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;color:inherit}

.canvas{max-width:1024px;margin:24px auto;background:var(--bg-page);display:flex;box-shadow:0 1px 4px rgba(0,0,0,.12);min-height:768px}

/* ==== 左側 icon rail ==== */
.sidebar{width:64px;flex:0 0 64px;background:var(--sidebar-bg);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:16px 4px}
.sidebar .logo{width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600}
.nav-list{display:flex;flex-direction:column;gap:2px;margin-top:8px;align-items:center}
.nav-item{width:56px;height:54px;border-radius:var(--r-nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:rgba(255,255,255,.6)}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav-item span{font-size:10px;line-height:14px;font-weight:500}
.nav-item:hover{background:#3d3d3d}
.nav-item.active{color:var(--primary)}
.sidebar-bottom{display:flex;flex-direction:column;gap:8px;align-items:center;color:rgba(255,255,255,.6);font-size:10px}
.sidebar-bottom .avatar{width:28px;height:28px;border-radius:50%;background:#555;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}

/* ==== 設定分類選單 ==== */
.settings-nav{width:188px;flex:0 0 188px;background:var(--bg-page);padding:24px 8px;display:flex;flex-direction:column;gap:28px;border-right:1px solid var(--border-card);overflow:auto}
.nav-group-title{display:flex;align-items:center;gap:4px;padding:0 8px;margin-bottom:8px;color:var(--primary);font-size:16px;line-height:20px;font-weight:500}
.nav-group-title .dot{width:14px;height:14px;border:1px solid var(--primary);border-radius:3px}
.nav-sub{display:flex;flex-direction:column;gap:2px}
.nav-sub a{display:block;padding:8px 16px;border-radius:var(--r-nav);font-size:14px;line-height:18px;font-weight:500;color:var(--text-muted);text-decoration:none;cursor:pointer}
.nav-sub a:hover{background:rgba(0,0,0,.03)}
.nav-sub a.active{color:var(--text-strong);background:linear-gradient(rgba(236,248,243,.25),rgba(236,248,243,.25)),rgba(0,0,0,.05)}

/* ==== 手機頂欄 ==== */
.mtopbar{display:none;background:#fff;border-bottom:1px solid var(--border-card);padding:10px 16px;align-items:center;gap:12px;position:sticky;top:0;z-index:60}
.mtopbar .burger,.mtopbar .acct{width:32px;height:32px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--text-strong);cursor:pointer}
.mtopbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.mtopbar .mlogo{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.mtopbar .sp{flex:1}
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:70;display:none}
.drawer-mask.show{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:260px;background:var(--bg-page);z-index:71;padding:20px 8px;overflow:auto;transform:translateX(-105%);transition:transform .2s;display:flex;flex-direction:column;gap:28px}
.drawer.show{transform:none}

/* ==== 主內容 ==== */
.main{flex:1;display:flex;flex-direction:column;background:var(--bg-page);min-width:0}
.page-title{padding:30px 20px 0;display:flex;flex-direction:column;gap:4px}
.crumb{font-size:14px;color:var(--text-body);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumb a{color:var(--text-body);text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--primary-dark)}
.crumb .sep svg{width:12px;height:12px;stroke:var(--icon-muted);stroke-width:2;fill:none}
.crumb .here{color:var(--text-strong);font-weight:500}
.h1{font-size:24px;line-height:32px;font-weight:500;margin-top:8px}
.content{padding:24px 20px 60px;display:flex;flex-direction:column;gap:20px}

/* ==== 卡片 ==== */
.card{background:#fff;border:1px solid var(--border-card);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:16px}
.card .card-head{display:flex;align-items:flex-start;gap:16px}
.card .ch-main{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .ch-title{font-size:18px;line-height:24px;font-weight:500}
.card .ch-desc{font-size:14px;line-height:20px;color:var(--text-body)}
.rows{display:flex;flex-direction:column;gap:10px}
.g-row{display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--border-field);border-radius:var(--r-card);background:#fff;cursor:pointer}
.g-row:hover{border-color:var(--border-on)}
.g-row.dim{background:#f7f7f7}
.g-row .gr-main{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.g-row .gr-name{font-size:16px;line-height:22px;font-weight:500;word-break:break-all}
.g-row .gr-sub{font-size:14px;line-height:20px;color:var(--text-body)}
.g-row .arrow svg{width:8px;height:14px;stroke:var(--icon-muted);stroke-width:1.6;fill:none}

/* 群組內頁 header 卡 */
.grp-head-card{background:#fff;border:1px solid var(--border-card);border-radius:var(--r-card);padding:20px;display:flex;align-items:flex-start;gap:16px}
.grp-head-card .ghc-main{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.grp-head-card .ghc-name{font-size:20px;line-height:28px;font-weight:500;word-break:break-all}
.grp-head-card .ghc-sub{font-size:14px;line-height:20px;color:var(--text-body)}
.sec-head{display:flex;align-items:center;gap:16px}
.sec-head .t{font-size:18px;line-height:24px;font-weight:500;flex:1}
.unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.u-card{display:flex;align-items:center;gap:8px;padding:12px 16px;border:1px solid var(--border-field);border-radius:var(--r-card);background:#fff}
.u-card .uc-main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.u-card .uc-name{font-size:15px;line-height:21px;font-weight:500;word-break:break-all}
.u-card .uc-cap{font-size:13px;line-height:18px;color:var(--text-body);display:inline-flex;align-items:center;gap:4px}
.u-card .uc-cap svg{width:14px;height:14px;stroke:var(--icon-muted);stroke-width:1.6;fill:none}

/* ==== 按鈕 ==== */
.btn-md{display:inline-flex;align-items:center;gap:6px;height:34px;padding:8px 16px;border-radius:var(--r-btn);font-size:14px;line-height:18px;font-weight:500;cursor:pointer;border:1px solid transparent;background:transparent;white-space:nowrap}
.btn-md.primary{background:var(--primary);color:#fff}
.btn-md.primary:hover{background:var(--primary-dark)}
.btn-md.ghost{background:#fff;border-color:var(--border-field);color:var(--text-body)}
.btn-md.ghost-green{background:#fff;border-color:var(--primary);color:var(--primary)}
.btn-md.ghost-red{background:#fff;border-color:var(--alert);color:var(--alert)}
.btn-md.disabled,.btn-lg.disabled{background:var(--btn-disabled);color:#fff;cursor:not-allowed;border-color:transparent}
.btn-md svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none}
.btn-lg{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:10px 24px;border-radius:var(--r-btn);font-size:16px;line-height:20px;font-weight:500;cursor:pointer;border:1px solid transparent;background:transparent}
.btn-lg.primary{background:var(--primary);color:#fff}
.btn-lg.ghost{background:#fff;border-color:var(--border-field);color:var(--text-body)}
.btn-row{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.icon-btn{width:32px;height:32px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--icon-muted);cursor:pointer;background:transparent;border:0}
.icon-btn:hover{background:rgba(0,0,0,.05)}
.icon-btn.danger{color:var(--alert)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none}

/* ==== 表單 ==== */
.inline-form{border:1px solid var(--border-field);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:16px;background:#fff}
.inline-form .if-title{font-size:16px;line-height:22px;font-weight:500;color:var(--text-muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:14px;line-height:20px;font-weight:500;display:flex;align-items:center;gap:8px}
.input{height:36px;padding:8px 10px;border:1px solid var(--border-field);border-radius:var(--r-input);background:#fff;font-size:14px;line-height:20px;display:flex;align-items:center;gap:5px}
.input:focus-within{border-color:var(--border-on)}
.input input{flex:1;border:0;outline:0;background:transparent;font-size:14px;color:var(--text-strong);min-width:0}
.input input::placeholder{color:var(--text-disabled)}
.input.disabled{background:#f5f5f5}
.input.disabled input{color:var(--text-disabled)}
.field .hint{font-size:12px;line-height:16px;color:var(--text-muted)}
.err-msg{display:none;color:var(--alert);font-size:12px;line-height:1.3;letter-spacing:.4px}
.err-msg.show{display:inline-block}
.field.has-error .input{border-color:var(--alert)}
.check{display:flex;align-items:flex-start;gap:8px;cursor:pointer}
.box{width:20px;height:20px;border-radius:var(--r-tag);border:1px solid var(--border-field);background:#fff;flex:0 0 20px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:1px}
.box.on{background:var(--primary);border-color:var(--border-field)}
.box.on::after{content:"";width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.ck-label{font-size:14px;line-height:20px;font-weight:500}
.ck-desc{font-size:12px;line-height:17px;color:var(--text-body);margin-top:2px}
.sub-field{margin-left:28px;display:none;align-items:center;gap:12px}
.sub-field.show{display:flex}
.sub-field .sf-label{font-size:14px;font-weight:500}
.num-input{width:88px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
select.sel{height:36px;padding:0 10px;border:1px solid var(--border-field);border-radius:var(--r-input);background:#fff;font-size:14px;outline:0;width:100%}
select.sel:focus{border-color:var(--border-on)}

/* ==== Modal / Toast ==== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:8px;padding:24px;width:480px;max-width:94vw;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 32px rgba(0,0,0,.2);max-height:90vh;overflow:auto}
.modal h3{font-size:18px;line-height:24px;font-weight:500}
.modal .m-body{font-size:14px;line-height:21px;color:var(--text-body);display:flex;flex-direction:column;gap:14px}
.modal .btn-row .left{margin-right:auto}
.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:rgba(40,40,40,.92);color:#fff;padding:9px 18px;border-radius:100px;font-size:14px;line-height:1.4;letter-spacing:.5px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--text-body);padding:28px 0;font-size:14px}

/* ==== 變更預約模式 ==== */
.cur-mode{display:flex;flex-direction:column;gap:6px}
.cur-mode .lb{font-size:12px;color:var(--text-muted)}
.cur-mode .val{align-self:flex-start;background:var(--primary-l2);color:var(--primary-dark);font-size:16px;font-weight:500;padding:6px 12px;border-radius:6px}
.opt-row{padding:14px 16px;border-radius:var(--r-card);background:#fff;border:1px solid var(--border-field);cursor:pointer;display:flex;align-items:flex-start;gap:14px}
.opt-row.on{background:var(--bg-selected);border-color:var(--primary)}
.radio{width:20px;height:20px;border-radius:50%;border:1px solid var(--border-field);background:#fff;flex:0 0 20px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt-row.on .radio{border-color:var(--primary)}
.opt-row.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.opt-row .om{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.opt-row .ot{font-size:16px;line-height:22px;font-weight:500}
.opt-row .osuit{align-self:flex-start;display:inline-flex;padding:2px 8px;border-radius:var(--r-tag);background:#f5f5f5;border:1px solid var(--border-field);font-size:13px;line-height:18px;color:var(--text-body)}
.opt-row .odetail{display:none;flex-direction:column;gap:8px;font-size:14px;line-height:20px;color:var(--text-body);margin-top:4px}
.opt-row.on .odetail{display:flex}
.opt-row .odetail b{color:var(--text-strong);font-weight:500}
.mode-flex{display:flex;gap:20px;align-items:flex-start}
.mode-flex .opts{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.mode-preview{width:340px;flex:0 0 340px;background:#f5f5f5;border-radius:var(--r-card);padding:14px;display:flex;flex-direction:column;gap:10px}
.mode-preview .pv-t{font-size:14px;font-weight:500;color:var(--text-body)}
.mode-preview img{width:100%;height:auto;border-radius:8px;border:1px solid var(--border-card);background:#fff}
.mode-preview .none{font-size:13px;color:var(--text-muted);padding:24px 0;text-align:center}
@media (max-width:760px){
  .mode-flex{flex-direction:column}
  .mode-preview{width:100%;flex:auto}
}

/* ==== 時段設定 ==== */
.slot-card{border:1px solid var(--border-field);border-radius:var(--r-card);background:#fff;display:flex;flex-direction:column}
.slot-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;flex-wrap:wrap}
.slot-head .exp{width:22px;height:22px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--icon-muted);flex:0 0 22px;transition:transform .15s}
.slot-head .exp svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none}
.slot-card.open .slot-head .exp{transform:rotate(90deg)}
.slot-head .sname{font-size:16px;font-weight:500}
.slot-head .warn-ic{color:var(--emphasis-d);display:inline-flex}
.slot-head .warn-ic svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
.day-mini{display:inline-flex;gap:2px}
.day-mini span{width:22px;height:22px;border-radius:4px;background:#f5f5f5;color:var(--text-disabled);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.day-mini span.on{background:var(--primary-l2);color:var(--primary-dark);font-weight:500}
.slot-tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;background:#f5f5f5;font-size:13px;color:var(--text-strong)}
.slot-head .tools{margin-left:auto;display:flex;gap:4px}
.slot-body{display:none;border-top:1px solid var(--border-card);padding:16px;gap:24px}
.slot-card.open .slot-body{display:flex}
.slot-col{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;font-size:14px;line-height:20px}
.slot-col .ct{font-size:13px;color:var(--text-muted);font-weight:500}
.slot-col li{margin-left:18px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills .p{min-width:54px;height:24px;padding:0 8px;background:#fff;border:1px solid var(--border-field);border-radius:4px;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.pills-box{background:#f5f5f5;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pills-box .lb{font-size:14px;color:var(--text-body)}
.pills-box .none-hint{font-size:13px;color:var(--text-muted)}
.link-green{color:var(--primary-dark);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.dep-line{display:flex;flex-direction:column;gap:2px}
.dep-line .dn{display:inline-flex;align-items:center;gap:6px;color:var(--emphasis-d);font-weight:500}
.dep-line .dd{font-size:13px;color:var(--text-body)}
.appr-line{color:var(--primary-dark);font-weight:500;display:inline-flex;align-items:center;gap:6px}
/* 表單 */
.fsec{background:#fff;border:1px solid var(--border-card);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:18px}
.fsec .fst{font-size:16px;line-height:22px;font-weight:500}
.day-chips{display:flex;gap:8px;flex-wrap:wrap}
.day-chip{padding:7px 14px;border:1px solid var(--border-field);border-radius:var(--r-btn);background:#fff;font-size:14px;cursor:pointer}
.day-chip.on{background:var(--primary-l3);border-color:var(--primary);color:var(--primary-dark);font-weight:500}
.radio-card{border:1px solid var(--border-field);border-radius:var(--r-card);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:12px;background:#fff}
.radio-card.on{border-color:var(--primary)}
.radio-card .rc-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.radio-card .rc-body{padding-left:28px;display:none;flex-direction:column;gap:12px}
.radio-card.on .rc-body{display:flex}
.inline-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.inline-ctl .input{width:auto}
.time-input input{border:0;outline:0;background:transparent;font-size:14px;font-family:inherit}
.custom-times{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ct-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-field);border-radius:6px;padding:4px 8px;font-size:13px;background:#fff}
.ct-chip button{border:0;background:none;cursor:pointer;color:var(--icon-muted);font-size:14px;line-height:1}
.overlap-err{display:flex;flex-direction:column;gap:4px;color:var(--alert);font-size:13px}
.unit-tree{display:flex;flex-direction:column;gap:12px}
.unit-tree .ut-g{display:flex;flex-direction:column;gap:8px}
.unit-tree .ut-gh{font-size:14px;font-weight:500}
.unit-tree .ut-radio{display:flex;gap:20px;padding-left:4px;font-size:14px}
.unit-tree .ut-radio label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.unit-tree .ut-units{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px;padding-left:24px}
.unit-tree .ut-units label{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.adv-item{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-bottom:1px solid var(--border-card)}
.adv-item:last-child{border-bottom:0}
.adv-sub{margin-left:28px;display:none;align-items:center;gap:10px;flex-wrap:wrap}
.adv-sub.show{display:flex}
.dep-opts{margin-left:28px;display:none;flex-direction:column;gap:8px}
.dep-opts.show{display:flex}
.dep-opt{border:1px solid var(--border-field);border-radius:10px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.dep-opt.on{border-color:var(--primary);background:var(--primary-l3)}
.dep-opt .dm{display:flex;flex-direction:column;gap:2px}
.dep-opt .dm .t{font-size:14px;font-weight:500}
.dep-opt .dm .d{font-size:13px;color:var(--text-body)}
@media (max-width:760px){
  .slot-body{flex-direction:column}
  .unit-tree .ut-units{grid-template-columns:1fr}
  .slot-head .tools{margin-left:0}
}

/* ==== Demo 工具 ==== */
.demo-fab{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;gap:8px}
.demo-fab .btn-md{box-shadow:0 2px 10px rgba(0,0,0,.15)}

/* ==== RWD ==== */
@media (max-width:760px){
  body{background:var(--bg-page)}
  .canvas{margin:0;min-height:100vh;box-shadow:none;display:block}
  .sidebar,.settings-nav{display:none}
  .mtopbar{display:flex}
  .page-title{padding:16px 16px 0}
  .h1{font-size:20px;line-height:28px}
  .content{padding:16px 16px 80px}
  .card{padding:16px}
  .btn-full-m{width:100%;justify-content:center;height:44px;font-size:16px;border-radius:var(--r-btn)}
  .card .card-head{flex-direction:column}
  .grid2{grid-template-columns:1fr}
  .unit-grid{grid-template-columns:1fr}
  .sec-head{flex-wrap:wrap}
  .grp-head-card{flex-direction:column}
  .grp-head-card .btn-md{align-self:flex-start}

/* =====================================================
   預約區（Part3 自建預約）— 依 Figma「2026 Jul. 預約系統操作優化」刻製
   ===================================================== */
body.area-book .settings-nav,
body.area-book .page-title{display:none}
body.area-book .content{padding:0;gap:0}

.bk-head{padding:16px 20px 10px;display:flex;flex-direction:column;gap:10px;background:var(--bg-surface);border-bottom:1px solid var(--border-card)}
.bk-head .r1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bk-head h1{font-size:24px;line-height:32px;font-weight:500}
.bk-date{display:flex;align-items:center;gap:10px;margin:0 auto;font-size:15px;font-weight:500}
.bk-date button{width:24px;height:24px;border-radius:50%;border:none;background:var(--primary-l3);color:var(--primary-dark);cursor:pointer;display:flex;align-items:center;justify-content:center}
.bk-date button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4}
.bk-date .today{border:1px solid var(--border-field);background:var(--bg-surface);border-radius:100px;padding:2px 10px;font-size:13px;width:auto;height:auto;color:var(--text-body)}
.bk-views{display:flex;background:var(--bg-page);border-radius:var(--r-btn);padding:3px;gap:2px}
.bk-views button{border:none;background:none;padding:6px 16px;border-radius:6px;font-size:14px;color:var(--text-body);cursor:pointer}
.bk-views button.on{background:var(--primary-l3);color:var(--primary-dark);font-weight:500}
.bk-chips{display:flex;gap:10px;flex-wrap:wrap}
.bk-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:18px;padding:3px 10px;border-radius:100px;background:var(--bg-page);color:var(--text-body)}
.bk-chip.warn{background:#fdecec;color:var(--alert)}
.bk-chip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.bk-head .r3{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bk-sms{font-size:13px;color:var(--emphasis-d)}
.bk-tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.bk-tools .ico{width:32px;height:32px;border-radius:50%;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--icon-muted)}
.bk-tools .ico.on{background:var(--primary-l3);color:var(--emphasis-d)}
.bk-tools .ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}

.bk-body{display:flex;align-items:stretch;min-height:520px}
.bk-main{flex:1;min-width:0;overflow:hidden}

/* ---- 時間軸 ---- */
.tl{display:flex;align-items:flex-start;font-size:12px}
.tl-side{flex:0 0 auto;display:flex;flex-direction:column;background:var(--bg-surface);border-right:1px solid var(--border-card);position:sticky;left:0;z-index:3}
.tl-side .sh{height:30px;display:flex;align-items:center;padding:0 10px;color:var(--text-body);border-bottom:1px solid var(--border-card);font-size:12px}
.tl-g{display:flex;border-bottom:1px solid var(--border-card)}
.tl-gl{flex:0 0 38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-body);border-right:1px solid var(--border-card);text-align:center;line-height:1.3;padding:0 2px}
.tl-us{flex:0 0 52px}
.tl-us div{height:50px;display:flex;align-items:center;justify-content:center;color:var(--text-body);border-bottom:1px solid var(--border-card)}
.tl-us div:last-child{border-bottom:none}
.tl-scroll{flex:1;min-width:0;overflow-x:auto}
.tl-inner{position:relative}
.tl-th{height:30px;display:flex;border-bottom:1px solid var(--border-card);background:var(--bg-surface)}
.tl-th span{flex:0 0 74px;padding-left:6px;line-height:30px;color:var(--text-body)}
.tl-row{height:50px;position:relative;border-bottom:1px solid var(--border-card);background-image:linear-gradient(to right,var(--border-card) 1px,transparent 1px);background-size:74px 100%}
.tl-row.alt{background-color:#fcfcfc}
.tl-now{position:absolute;top:30px;bottom:0;width:2px;background:#ff5b5b;z-index:4;pointer-events:none}
.tl-chip{position:absolute;top:4px;height:42px;border-radius:5px;padding:4px 6px;overflow:hidden;cursor:pointer;line-height:15px;z-index:2;border:1px solid transparent}
.tl-chip .n{display:flex;align-items:center;gap:3px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-chip .p{opacity:.85;white-space:nowrap}
.tl-chip .cnt{position:absolute;right:5px;bottom:3px;display:flex;align-items:center;gap:2px;font-size:11px}
.tl-chip .bang{position:absolute;right:4px;top:3px;width:14px;height:14px;border-radius:3px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}
.tl-chip svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}

/* ---- 空間圖 ---- */
.sp-tabs{display:flex;gap:2px;padding:14px 16px 0}
.sp-tabs button{border:none;background:var(--bg-page);color:var(--text-body);padding:9px 22px;border-radius:8px 8px 0 0;font-size:14px;cursor:pointer}
.sp-tabs button.on{background:var(--bg-surface);color:var(--text-strong);font-weight:500}
.sp-canvas{background:var(--bg-surface);padding:34px 26px;display:flex;flex-wrap:wrap;gap:30px;align-content:flex-start;min-height:420px}
.sp-u{width:78px;position:relative;cursor:pointer;text-align:center}
.sp-shape{height:78px;border:1px solid var(--border-field);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;line-height:17px;position:relative;overflow:hidden;background:var(--bg-surface)}
.sp-u.rect .sp-shape{border-radius:6px}
.sp-u.circ .sp-shape{border-radius:50%}
.sp-shape .cap{font-size:11px;opacity:.7}
.sp-shape .bar{position:absolute;left:0;right:0;bottom:0;height:15px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;line-height:15px}
.sp-u .bang{position:absolute;right:-2px;top:-4px;width:16px;height:16px;border-radius:50%;background:var(--alert);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2}
.sp-u .bell{position:absolute;right:6px;bottom:20px;width:16px;height:16px;border-radius:50%;background:var(--alert);color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
.sp-u .bell svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2}

/* ---- 清單 ---- */
.ls-tabs{display:flex;gap:4px;padding:12px 16px 0;overflow-x:auto;background:var(--bg-surface);border-bottom:1px solid var(--border-card)}
.ls-tabs button{border:none;background:none;padding:8px 10px 12px;font-size:14px;color:var(--text-body);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.ls-tabs button.on{color:var(--primary-dark);font-weight:500;border-bottom-color:var(--primary)}
.ls-body{padding:0 0 30px}
.ls-daybar{padding:14px 18px 6px;font-size:15px;font-weight:500}
.ls-timebar{background:var(--bg-page);padding:7px 18px;font-size:13px;color:var(--text-body);display:flex;align-items:center;gap:12px}
.ls-timebar svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.ls-card{display:flex;gap:14px;padding:16px 18px;border-bottom:1px solid var(--border-card);background:var(--bg-surface)}
.ls-l{flex:0 0 92px;font-size:15px;font-weight:500}
.ls-l .dur{font-size:12px;color:var(--text-muted);font-weight:400;margin-top:3px}
.ls-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--text-body)}
.ls-c .nm{font-size:17px;font-weight:500;color:var(--text-strong);display:flex;align-items:baseline;gap:6px}
.ls-c .nm em{font-style:normal;font-size:12px;color:var(--text-muted)}
.ls-c .pax{margin-left:auto;color:var(--primary-dark);font-size:13px}
.ls-c .pax b{font-size:19px}
.ls-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ls-tag{border:1px solid var(--border-field);border-radius:var(--r-tag);padding:1px 7px;font-size:12px;color:var(--text-body)}
.ls-tag.unit{background:var(--bg-page);border-color:transparent}
.ls-note{background:var(--bg-page);border-radius:6px;padding:7px 10px;font-size:12px}
.ls-foot{font-size:11px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap}
.ls-r{flex:0 0 118px;display:flex;flex-direction:column;align-items:stretch;gap:8px;font-size:12px}
.ls-r .st{justify-content:flex-end}
.ls-r button{width:100%;justify-content:center}
.ls-r .st{display:flex;align-items:center;gap:5px}
.ls-r .st i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.ls-empty{padding:56px 20px;text-align:center;color:var(--text-muted);font-size:14px}

/* ---- 右側顧客清單 ---- */
.cl{flex:0 0 292px;border-left:1px solid var(--border-card);background:var(--bg-surface);display:flex;flex-direction:column;min-width:0}
.cl.mini{flex-basis:44px}
.cl-tabs{display:flex;align-items:center;border-bottom:1px solid var(--border-card)}
.cl-tabs button{flex:1;border:none;background:none;padding:12px 8px;font-size:14px;color:var(--text-body);cursor:pointer}
.cl-tabs button.on{color:var(--text-strong);font-weight:500;background:var(--bg-page)}
.cl-tabs .fold{flex:0 0 34px;padding:0;height:34px;border-radius:50%;color:var(--icon-muted)}
.cl-tabs .fold svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.cl-pills{display:flex;gap:8px;padding:10px;overflow-x:auto}
.cl-pills button{flex:0 0 auto;border:none;border-radius:var(--r-btn);background:var(--bg-page);color:var(--text-body);padding:8px 12px;cursor:pointer;font-size:12px;line-height:17px;text-align:center}
.cl-pills button.on{background:var(--primary-l2);color:var(--primary-dark);font-weight:500}
.cl-pills button b{display:block;font-size:15px}
.cl-list{flex:1;overflow:auto;padding:0 10px 14px;display:flex;flex-direction:column;gap:10px}
.cl-card{border:1px solid var(--border-card);border-radius:var(--r-card);overflow:hidden;font-size:12px;color:var(--text-body)}
.cl-card .hd{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border-card);font-size:13px;color:var(--text-strong)}
.cl-card .hd .st{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:4px}
.cl-card .hd .st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.cl-card .bd{padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.cl-card .nm{font-size:16px;font-weight:500;color:var(--text-strong);display:flex;align-items:baseline;gap:5px}
.cl-card .nm em{font-style:normal;font-size:11px;color:var(--text-muted)}
.cl-card .nm .pax{margin-left:auto;color:var(--primary-dark);font-size:12px}
.cl-card .nm .pax b{font-size:17px}
.cl-acts{display:flex;border-top:1px solid var(--border-card)}
.cl-acts button{flex:1;border:none;background:var(--bg-page);color:var(--text-body);padding:9px;font-size:13px;cursor:pointer;border-left:1px solid var(--border-card)}
.cl-acts button:first-child{border-left:none}
.cl-acts button.pri{background:var(--primary);color:#fff}
.cl-mini{writing-mode:vertical-rl;padding:14px 0;color:var(--text-body);font-size:13px;cursor:pointer;letter-spacing:2px}

/* ---- popover ---- */
.pop-mask{position:fixed;inset:0;z-index:150;display:none}
.pop-mask.show{display:block}
.pop{position:absolute;width:324px;background:var(--bg-surface);border-radius:var(--r-card);box-shadow:0 6px 28px rgba(0,0,0,.22);overflow:hidden;font-size:13px;color:var(--text-body)}
.pop .hd{display:flex;align-items:center;background:var(--bg-page)}
.pop .hd .t{flex:1;padding:9px 12px;font-size:14px;color:var(--text-strong)}
.pop .hd .s{padding:9px 12px;font-size:13px}
.pop .bd{padding:11px 13px;display:flex;flex-direction:column;gap:7px}
.pop .ft{display:flex;justify-content:flex-end;padding:0 13px 13px}

/* ---- 新增／修改預約 側邊表單 ---- */
.bkf-mask{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:210;display:none}
.bkf-mask.show{display:block}
.bkf{position:fixed;top:0;right:0;bottom:0;width:350px;max-width:100vw;background:var(--bg-surface);z-index:211;display:none;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.14)}
.bkf.show{display:flex}
.bkf-hd{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border-card)}
.bkf-hd h3{flex:1;text-align:center;font-size:16px;font-weight:500;color:var(--primary-dark)}
.bkf-hd button{border:none;background:none;cursor:pointer;color:var(--icon-muted);width:24px;height:24px}
.bkf-hd button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.bkf-bd{flex:1;overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.bkf-ft{padding:12px 16px;border-top:1px solid var(--border-card)}
.bkf-ft button{width:100%;border:none;border-radius:var(--r-btn);background:var(--primary);color:#fff;padding:12px;font-size:15px;cursor:pointer}
.bkf-ft button:disabled{background:var(--btn-disabled);cursor:not-allowed}
.bkf .walkin{border:1px solid var(--border-field);border-radius:var(--r-input);padding:11px 13px;display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.bkf .walkin span{font-size:14px;color:var(--text-strong)}
.bkf .walkin small{display:block;font-size:11px;color:var(--text-muted);margin-top:2px}
.bkf .itembox{background:var(--primary-l3);border-radius:var(--r-input);padding:9px 13px;text-align:center}
.bkf .itembox label{font-size:11px;color:var(--primary-dark)}
.bkf .itembox select{width:100%;border:none;background:none;font-size:15px;text-align:center;color:var(--text-strong);cursor:pointer;margin-top:3px}
.bkf .dateline{text-align:center;font-size:15px}
.bkf .dateline input{border:none;background:none;font-size:15px;text-align:center;cursor:pointer;color:var(--text-strong)}
.bkf .timeline-v{text-align:center}
.bkf .timeline-v .big{font-size:20px;letter-spacing:2px;color:var(--text-strong)}
.bkf .timeline-v .big.empty{color:var(--text-disabled)}
.bkf .timeline-v .hint{font-size:12px;color:var(--emphasis-d);margin-top:2px}
.bkf .timeline-v select{margin-top:8px;border:1px solid var(--border-field);border-radius:100px;padding:5px 12px;font-size:13px;background:var(--bg-surface)}
.bkf .pax{display:flex;gap:10px}
.bkf .pax > div{flex:1;text-align:center}
.bkf .pax .lb{font-size:14px;color:var(--text-strong);margin-bottom:6px}
.bkf .stepper{display:flex;align-items:center;justify-content:center;gap:14px}
.bkf .stepper button{width:26px;height:26px;border-radius:50%;border:1px solid var(--primary);background:none;color:var(--primary);font-size:15px;line-height:1;cursor:pointer}
.bkf .stepper button:disabled{border-color:var(--btn-disabled);color:var(--btn-disabled);cursor:not-allowed}
.bkf .stepper .v{min-width:24px;font-size:16px}
.bkf .fld{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border-field);padding-bottom:7px}
.bkf .fld svg{width:15px;height:15px;stroke:var(--icon-muted);fill:none;stroke-width:1.8;flex:0 0 15px}
.bkf .fld input{flex:1;border:none;background:none;font-size:14px;outline:none}
.bkf .fld.err{border-bottom-color:var(--alert)}
.bkf .errmsg{font-size:11px;color:var(--alert);margin-top:-8px}
.bkf .radios{display:flex;gap:16px;font-size:14px}
.bkf .radios label{display:flex;align-items:center;gap:5px;cursor:pointer}
.bkf .unitbox{background:var(--bg-page);border-radius:var(--r-input);padding:10px 12px;font-size:12px}
.bkf .unitbox .top{display:flex;align-items:center}
.bkf .unitbox .top a{margin-left:auto;color:var(--primary-dark);cursor:pointer}
.bkf .unitbox .gname{display:inline-block;border:1px solid var(--border-field);border-radius:var(--r-tag);padding:0 6px;margin:7px 0 4px;font-size:11px}
.bkf .unitbox .names{font-size:14px;color:var(--text-strong)}
.bkf .acc{background:var(--bg-page);border-radius:var(--r-input);padding:11px 12px}
.bkf .acc .top{display:flex;align-items:center;font-size:12px;cursor:pointer}
.bkf .acc .top svg{margin-left:auto;width:15px;height:15px;stroke:var(--icon-muted);fill:none;stroke-width:2}
.bkf .acc .in{display:flex;flex-direction:column;gap:10px;margin-top:11px}
.bkf .acc .in label{font-size:12px;color:var(--text-body)}
.bkf .acc input[type=text],.bkf .acc select{width:100%;border:1px solid var(--border-field);border-radius:6px;padding:7px 9px;font-size:13px;background:var(--bg-surface);margin-top:4px}
.bkf .qopts{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.bkf .qopts button{border:1px solid var(--border-field);background:var(--bg-surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.bkf .qopts button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.bkf .toggline{display:flex;align-items:center;font-size:15px}
.bkf .togg{margin-left:auto;width:44px;height:24px;border-radius:100px;background:var(--btn-disabled);position:relative;cursor:pointer;border:none;flex:0 0 44px}
.bkf .togg.on{background:var(--primary)}
.bkf .togg i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.bkf .togg.on i{left:23px}
.bkf .togg.lock{opacity:.55;cursor:not-allowed}
.bkf .subbox{background:var(--bg-page);border-radius:var(--r-input);padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12px}
.bkf .subbox label{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}

/* 選擇預約單位子面板 */
.bku-sum{background:var(--primary-l3);border-radius:var(--r-input);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.bku-sum b{color:var(--primary-dark);font-size:17px;margin:0 4px}
.bku-sum .lack b{color:var(--alert)}
.bku-bar{display:flex;align-items:center;gap:12px}
.bku-bar button.all{flex:1;border:1px solid var(--primary);border-radius:var(--r-btn);background:none;color:var(--primary-dark);padding:8px;font-size:14px;cursor:pointer}
.bku-bar select{border:none;background:none;font-size:13px;color:var(--text-body)}
.bku-g{display:flex;flex-direction:column;gap:8px}
.bku-g > label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.bku-chips{background:var(--bg-page);border-radius:var(--r-input);padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bku-chips button{border:1px solid var(--border-field);border-radius:6px;background:var(--bg-surface);padding:7px 4px;font-size:12px;line-height:16px;cursor:pointer}
.bku-chips button.on{border-color:var(--primary);background:var(--primary-l3);color:var(--primary-dark)}

  async createGroup({ name, merge, mergeMax }) {

    if (db.groups.some(g => g.name === name)) throw { field: 'name', msg: '此名稱已被使用' };
    const g = { id: 'g' + (++db.seq), name, isDefault: false, merge, mergeMax };
    db.groups.unshift(g); // 設計稿：新群組排最上、預設群組固定墊底
    persist(); return g;
  },
  async updateGroup(id, { name, merge, mergeMax }) {
    await delay();
    const g = db.groups.find(x => x.id === id);
    if (!g.isDefault) {
      if (db.groups.some(x => x.id !== id && x.name === name)) throw { field: 'name', msg: '此名稱已被使用' };
      g.name = name;
    }
    g.merge = merge; g.mergeMax = mergeMax; persist(); return g;
  },
  async deleteGroup(id) {
    await delay();
    db.groups = db.groups.filter(g => g.id !== id);
    db.units = db.units.filter(u => u.gid !== id);
    persist();
  },
  async createUnits(gid, { name, min, max, qty }) {
    await delay();
    const names = qty <= 1 ? [name] : Array.from({ length: qty }, (_, i) => i === 0 ? name : `${name}-${i}`);
    const dup = names.find(n => db.units.some(u => u.gid === gid && u.name === n));
    if (dup) throw { field: 'name', msg: '此名稱已被使用' };
    for (const n of names) db.units.push({ id: 'u' + (++db.seq), gid, name: n, min, max });
    persist(); return names.length;
  },
  async updateUnit(id, { name, min, max, gid }) {
    await delay();
    const u = db.units.find(x => x.id === id);
    if (db.units.some(x => x.id !== id && x.gid === gid && x.name === name)) throw { field: 'name', msg: '此名稱已被使用' };
    Object.assign(u, { name, min, max, gid }); persist(); return u;
  },
  async deleteUnit(id) { await delay(); db.units = db.units.filter(u => u.id !== id); persist(); },
  async setMode(m) { await delay(); db.mode = m; persist(); },
  async saveSlot(s) {

  async deleteSlot(id) {

  async saveBooking(b) {

function toMin(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function toHM(min) { return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0'); }
function slotTimes(s) {
  if (s.type === 'custom') return [...s.times].sort((a, b) => toMin(a) - toMin(b));
  const out = []; if (!s.start || !s.end || toMin(s.end) < toMin(s.start)) return out;
  for (let m = toMin(s.start); m <= toMin(s.end); m += (+s.interval || 30)) out.push(toHM(m));
  return out;
}
function scopeUnits(s) {
  if (s.scope === 'all') return db.units.slice();
  const out = [];
  for (const [gid, sel] of Object.entries(s.scope || {})) {
    const us = db.units.filter(u => u.gid === gid);
    out.push(...(sel === 'all' ? us : us.filter(u => sel.includes(u.id))));
  }
  return out;
}
function slotCap(s) { const us = scopeUnits(s); return { count: us.length, cap: us.reduce((a, u) => a + (+u.max || 0), 0) }; }
function slotConflicts(s) {
  const mine = new Set(slotTimes(s));
  const hits = new Set();
  for (const o of slotList()) {
    if (o.id === s.id) continue;
    if ((o.itemId || null) !== (s.itemId || null)) continue;
    if (!o.days.some(d => s.days.includes(d))) continue;
    for (const t of slotTimes(o)) if (mine.has(t)) hits.add(t);
  }
  return [...hits].sort((a, b) => toMin(a) - toMin(b));
}

function p4cDefaultOrder(gidOrder) {
  const gids = db.groups.map(g => g.id);
  const groups = (gidOrder || []).filter(id => gids.includes(id))
    .concat(gids.filter(id => !(gidOrder || []).includes(id)));
  const units = {};
  gids.forEach(id => { units[id] = db.units.filter(u => u.gid === id).map(u => u.id); });
  return { groups, units };
}
function p4cNormOrder(o) {
  const gids = db.groups.map(g => g.id);
  o.groups = o.groups.filter(id => gids.includes(id)).concat(gids.filter(id => !o.groups.includes(id)));
  o.units = o.units || {};
  gids.forEach(gid => {
    const real = db.units.filter(u => u.gid === gid).map(u => u.id);
    const cur = (o.units[gid] || []).filter(id => real.includes(id));
    o.units[gid] = cur.concat(real.filter(id => !cur.includes(id)));
  });
  return o;
}
function p4cCombos(units, size) {
  const out = [];
  (function walk(start, acc) {
    if (acc.length === size) { out.push(acc.slice()); return; }
    for (let i = start; i < units.length; i++) { acc.push(units[i]); walk(i + 1, acc); acc.pop(); }
  })(0, []);
  return out;
}
function p4cEnsure() {
  if (!db.autoPrio2) {
    db.autoPrio2 = {
      rules: P4C_PRESETS[0].rules.slice(),
      order: p4cDefaultOrder(['g_indoor', 'g_bar', 'g_outdoor', 'g_default', 'g_room']),
    };
    persist();
  }
  db.autoPrio2.rules = db.autoPrio2.rules.filter(r => P4C_ALL.includes(r));
  p4cNormOrder(db.autoPrio2.order);
  return db.autoPrio2;
}
function p4cOffRules() { return P4C_ALL.filter(r => !db.autoPrio2.rules.includes(r)); }

/* ── 排位引擎 ───────────────────────────────────────────── */
function p4cLex(a, b) {
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const x = a[i] === undefined ? 1e9 : a[i], y = b[i] === undefined ? 1e9 : b[i];
    if (x !== y) return x - y;
  }
  return 0;
}
function p4cCmpRule(r, a, b) {
  if (r === 'unitorder') return p4cLex(a.m.unitorder, b.m.unitorder);
  if (r === 'fit') return (a.m.minGap - b.m.minGap) || (a.m.waste - b.m.waste);
  return a.m[r] - b.m[r];
}
function p4cAssign(people, occupied) {
  const P = p4cEnsure();
  const occ = occupied || new Set();
  const gRank = {}; P.order.groups.forEach((id, i) => { gRank[id] = i; });
  const cands = [];
  db.groups.forEach(g => {
    const cap = g.merge ? Math.max(1, g.mergeMax | 0) : 1;
    const us = (P.order.units[g.id] || []).map(id => db.units.find(u => u.id === id))
      .filter(u => u && !occ.has(u.id));
    for (let size = 1; size <= cap; size++) {
      p4cCombos(us, size).forEach(combo => {
        const sumMax = combo.reduce((a, u) => a + u.max, 0);
        const sumMin = combo.reduce((a, u) => a + u.min, 0);
        if (sumMax < people) return;
        cands.push({
          g, combo, sumMax, sumMin, n: combo.length,
          m: {
            group: gRank[g.id],
            waste: sumMax - people,
            minGap: Math.max(0, sumMin - people),
            fewest: combo.length,
            unitorder: combo.map(u => (P.order.units[g.id] || []).indexOf(u.id)).sort((a, b) => a - b),
          },
        });
      });
    }
  });
  const ids = c => c.combo.map(u => u.id).join(',');
  cands.sort((a, b) => {
    for (const r of P.rules) { const d = p4cCmpRule(r, a, b); if (d) return d; }
    return ids(a) < ids(b) ? -1 : 1;
  });
  return { cands, chosen: cands[0] || null };
}
function p4cComboLabel(c) { return esc(c.g.name) + '／' + c.combo.map(u => esc(u.name)).join(' ＋ '); }

function p4cRenderRules() {

/* 群組／桌位順序：圓圈數字＋「不可合併／可合併 N」 */
function p4cMergeLabel(g) {
  const m = g.merge ? Math.max(1, g.mergeMax | 0) : 1;
  return m === 1 ? '不可合併' : '可合併 ' + m;
}
function p4cRenderOrder() {
  const box = $('#p4cOrder'); if (!box) return;
  const order = db.autoPrio2.order;
  const gs = order.groups.map(id => db.groups.find(g => g.id === id)).filter(Boolean)
    .filter(g => db.units.some(u => u.gid === g.id));
  box.innerHTML = gs.map((g, gi) => {
    const us = (order.units[g.id] || []).map(id => db.units.find(u => u.id === id)).filter(Boolean);
    return `<div class="p4-gblock" draggable="true" data-cg="${gi}">
      <div class="p4-gbhead"><span class="p4-grip">⣿</span>
        <span class="p4c-num">${gi + 1}</span>
        <span class="p4-gchip">${esc(g.name)}</span>
        <span class="ord">${p4cMergeLabel(g)}</span></div>
      ${us.map((u, ui) => `<div class="p4-srow" draggable="true" data-cg="${gi}" data-cu="${ui}">
        <span class="p4-grip">⣿</span><span class="p4-sname">${esc(u.name)}</span>
        <span class="p4-scap">${u.min}~${u.max} 人</span></div>`).join('')}
    </div>`;
  }).join('');

  let src = null;
  document.querySelectorAll('#p4cOrder [data-cg]').forEach(el => {
    const isRow = el.classList.contains('p4-srow');
    el.addEventListener('dragstart', e => {
      if (isRow) e.stopPropagation();
      if (src && !isRow) return;
      src = el; el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => { src = null; p4cRenderOrder(); p4cRenderSim(); });
    el.addEventListener('dragover', e => {
      if (!src || src === el) return;
      if (src.classList.contains('p4-srow') !== isRow) return;
      if (isRow) { e.stopPropagation(); if (src.dataset.cg !== el.dataset.cg) return; }
      e.preventDefault(); el.classList.add('over');
    });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); if (!src) return;
      const order = db.autoPrio2.order;
      const gs = order.groups.map(id => db.groups.find(g => g.id === id)).filter(Boolean)
        .filter(g => db.units.some(u => u.gid === g.id));
      if (isRow) {
        e.stopPropagation();
        if (!src.classList.contains('p4-srow')) return;
        if (src.dataset.cg !== el.dataset.cg) { toast('不可跨群組排序'); return; }
        const arr = order.units[gs[+el.dataset.cg].id];
        const [m] = arr.splice(+src.dataset.cu, 1);
        arr.splice(+el.dataset.cu, 0, m);
      } else {
        if (src.classList.contains('p4-srow')) return;
        const from = order.groups.indexOf(gs[+src.dataset.cg].id);
        const to = order.groups.indexOf(gs[+el.dataset.cg].id);
        const [m] = order.groups.splice(from, 1);
        order.groups.splice(to, 0, m);
      }
      persist();
    });
  });
}

/* ── 模擬器 ─────────────────────────────────────────────── */
/* 依加入順序連續排位，回傳每組結果＋單位→組別對照 */
function p4cSimRun() {
  const occ = new Set(); const byUnit = {};
  const res = P4C_SIM.map((people, i) => {
    const r = p4cAssign(people, occ);
    if (r.chosen) r.chosen.combo.forEach(u => { occ.add(u.id); byUnit[u.id] = i; });
    return { people, chosen: r.chosen };
  });
  return { res, byUnit };
}
function p4cRenderSim() {
  const out = $('#p4cSimOut'); if (!out) return;
  document.querySelectorAll('[data-viz]').forEach(el =>
    el.classList.toggle('on', el.dataset.viz === P4C_VIZ));
  if (!P4C_SIM.length) {
    out.innerHTML = '<div class="p4-simnone" style="margin-top:12px">尚無模擬預約，輸入人數後按「加入」。</div>';
    return;
  }
  const { res, byUnit } = p4cSimRun();
  if (P4C_VIZ === 'list') { p4cSimList(out, res); } else { p4cSimMap(out, res, byUnit); }
  out.querySelectorAll('[data-simdel]').forEach(el => {
    el.onclick = () => { P4C_SIM.splice(+el.dataset.simdel, 1); p4cRenderSim(); };
  });
}
/* 版本一：列表 */
function p4cSimList(out, res) {
  out.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">

        <span style="min-width:52px"><b>${r.people} 人</b></span>

        <button class="btn-md ghost" data-simdel="${i}">移除</button>
      </div>
    </div>`).join('')}</div>`;
}
/* 版本二：桌位圖——所有桌位畫出來，被哪一組坐掉就上那組的顏色 */
function p4cSimMap(out, res, byUnit) {
  const chips = res.map((r, i) => {
    const col = P4C_COLORS[i % P4C_COLORS.length];
    return r.chosen
      ? `<span class="p4c-chip" style="background:${col}">${i + 1}・${r.people} 人
          <span class="x" data-simdel="${i}">✕</span></span>`
      : `<span class="p4c-chip na">${i + 1}・${r.people} 人 無法安排
          <span class="x" data-simdel="${i}" style="color:inherit">✕</span></span>`;
  }).join('');
  const order = db.autoPrio2.order;
  const gs = order.groups.map(id => db.groups.find(g => g.id === id)).filter(Boolean)
    .filter(g => db.units.some(u => u.gid === g.id));
  const map = gs.map((g, gi) => {
    const us = (order.units[g.id] || []).map(id => db.units.find(u => u.id === id)).filter(Boolean);
    return `<div class="p4c-mgroup">
      <div class="p4c-mghead"><span class="p4c-num">${gi + 1}</span><b>${esc(g.name)}</b>
        <span style="color:var(--text-muted)">${p4cMergeLabel(g)}</span></div>
      <div class="p4c-units">
        ${us.map(u => {
          const gi2 = byUnit[u.id];
          const w = 56 + u.max * 12;
          if (gi2 === undefined) return `<div class="p4c-unit" style="min-width:${w}px">
              <span>${esc(u.name)}</span><span class="cap">${u.min}~${u.max} 人</span></div>`;
          const col = P4C_COLORS[gi2 % P4C_COLORS.length];
          return `<div class="p4c-unit occ" style="min-width:${w}px;background:${col}">
              <span>${esc(u.name)}</span>
              <span class="tag">第 ${gi2 + 1} 組・${res[gi2].people} 人</span></div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  out.innerHTML = `<div class="p4c-chips">${chips}</div><div class="p4c-map">${map}</div>`;
}

.p4d-ico{width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-body);flex:none}
.p4d-ico svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none}

.p4d-ico.del{color:var(--alert)}
.p4d-ico.del:hover{background:#f9e9e9}

  font-size:15px;font-weight:700;color:var(--text-strong);margin-bottom:12px}
.p4d-notes{background:#f0f0f0;border-radius:var(--r-card);padding:16px 20px;font-size:13px;line-height:21px;color:var(--text-body);margin-top:18px}
.p4d-notes .nt{font-size:14px;font-weight:700;color:var(--text-strong);margin-bottom:6px}
.p4d-notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.p4d-notes ul ul{margin-top:4px;list-style:none;padding-left:4px}
.p4d-notes ul ul li::before{content:'◦';margin-right:6px}
.p4d-notes ol{margin:4px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.p4d-banner{display:flex;align-items:flex-start;gap:8px;margin:20px 0 18px;color:#c94848;font-size:16px;line-height:24px;font-weight:700}
.p4d-banner svg{width:20px;height:20px;stroke:#c94848;stroke-width:1.8;fill:none;flex:none;margin-top:2px}
.p4d-form{margin-bottom:12px}
.p4d-formtitle{font-size:15px;color:var(--text-muted)}
.p4d-grouplabel{font-size:14px;color:var(--text-muted)}

.p4d-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--text-strong)}
.p4d-inline .input{width:88px}
.p4d-inline .input input{text-align:center}
.p4d-err{display:none;color:var(--alert);font-size:12px;line-height:16px}
.p4d-err.show{display:block}
.input.p4d-bad{border-color:var(--alert)}
.input.p4d-bad input{color:var(--alert)}
.hint.p4d-bad{color:var(--alert)}
sel.p4d-bad,select.p4d-bad{border-color:var(--alert)}
.p4d-toast{position:fixed;top:88px;left:50%;transform:translateX(-50%);min-width:220px;text-align:center;
  padding:10px 24px;border-radius:6px;color:#fff;font-size:14px;line-height:20px;z-index:9999;
  opacity:0;pointer-events:none;transition:opacity .2s}
.p4d-toast.ok{background:#6cc39b}
.p4d-toast.err{background:#d05c5c}

.p4d-demo a.cur{color:var(--text-body);font-weight:700;text-decoration:none}

`;

/* 「重置範例」也把訂金規則與藍新註冊狀態還原（DEPOSITS 是 const，reload 以外要手動回種子） */
(function(){
  const rb = document.getElementById('resetBtn');
  if (rb) rb.addEventListener('click', () => {
    DEPOSITS.splice(0, DEPOSITS.length,
      { id: 'd1', name: '週末晚上', desc: '預先收款：2人以上，每人200元', way: 'prepay', cond: 'people', minPeople: 2, perPerson: 200, fixed: 200 },
      { id: 'd2', name: '特殊節日', desc: '信用卡授權綁定：每組300元', way: 'auth', cond: 'fixed', minPeople: 1, perPerson: 200, fixed: 300 });
    sessionStorage.removeItem('p4_dep_reg');
    P4D_FORM = null;
    if (location.hash.startsWith('#/p4deposit')) p4ViewDeposit();
  });
})();

function p4dReg(){ return sessionStorage.getItem('p4_dep_reg') || '1'; }
function p4dSetReg(v){ sessionStorage.setItem('p4_dep_reg', v); }
let p4dToastTimer;
function p4dToast(msg, kind){
  let t = document.getElementById('p4dToast');
  if (!t){ t = document.createElement('div'); t.id='p4dToast'; document.body.appendChild(t); }
  t.className = 'p4d-toast ' + (kind || 'ok'); t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(p4dToastTimer); p4dToastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function p4dDesc(f){
  return (f.way === 'auth' ? '信用卡授權綁定' : '預先收款') + '：' +
    (f.cond === 'fixed' ? `每組${f.fixed}元` : `${f.minPeople}人以上，每人${f.perPerson}元`);
}

/* 表單狀態：null＝關閉；{mode:'add'} 或 {mode:'edit', id} ＋工作值 f ＋錯誤 err */
let P4D_FORM = null;

const P4D_NOTES = `

      <li>範例2：顧客於1月1日送出1月2日中午12:00的預約申請，付款期限為1月2日上午11:30。</li></ul></li>

      <ul><li>範例：顧客若因故取消1月1日下午13:00的預約，需於1月8日晚上22:59前完成請款操作。</li></ul></li>
  </ul></div>`;

function p4dDemoBar(){
  const r = p4dReg();
  const lk = (v, n) => `<a data-p4dreg="${v}" class="${r === v ? 'cur' : ''}">${n}</a>`;
  return `<div class="p4d-demo">原型展示｜藍新註冊狀態：${lk('1','已註冊')} ${lk('new','剛註冊成功')} ${lk('0','未註冊')}</div>`;
}
function p4dBindDemo(){
  document.querySelectorAll('[data-p4dreg]').forEach(a => a.onclick = () => {
    p4dSetReg(a.dataset.p4dreg); P4D_FORM = null;
    if (location.hash === '#/p4deposit') p4ViewDeposit(); else location.hash = '#/p4deposit';
  });
}

function p4dFormHtml(){
  const { mode, f, err } = P4D_FORM;
  const numIn = (id, val, on, ph, bad) => `<div class="input${on ? '' : ' disabled'}${on && bad ? ' p4d-bad' : ''}">
    <input id="${id}" type="text" inputmode="numeric" value="${on ? esc(String(val)) : ''}" placeholder="${ph}" ${on ? '' : 'disabled'}></div>`;
  const people = f.cond === 'people', fixed = f.cond === 'fixed';
  return `
  <div class="card p4d-form" id="p4dForm">
    <div class="p4d-formtitle">${mode === 'edit' ? '編輯' : '新增'}訂金規則</div>
    <div class="field">
      <span class="field-label">訂金規則名稱</span>
      <div class="input${err.name ? ' p4d-bad' : ''}"><input id="p4dfName" value="${esc(f.name)}" placeholder="如：特殊節慶"></div>
      <span class="p4d-err${err.name ? ' show' : ''}">${err.name || ''}</span>
    </div>
    <hr class="p4d-div">
    <div class="p4d-grouplabel">收款方式</div>
    <div style="display:flex;flex-direction:column;gap:12px">
      ${[['prepay', '預先收款', '顧客可透過轉帳、信用卡、超商代碼完成訂金支付'],
         ['auth', '信用卡授權綁定', '顧客需完成信用卡授權，若顧客因故爽約，您可於授權期限內請款收取取消金額']]
        .map(([v, n, sub]) => `<label class="check" data-p4dway="${v}"><span class="radio p4-radio"${f.way === v ? ' data-on' : ''}></span>
          <span><span class="ck-label">${n}</span><div class="ck-desc">${sub}</div></span></label>`).join('')}
    </div>
    <hr class="p4d-div">
    <div class="p4d-grouplabel">收款條件</div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div>
        <label class="check p4d-inline" data-p4dcond="people" style="display:flex"><span class="radio p4-radio"${people ? ' data-on' : ''}></span>
          <span class="ck-label">依據預約人數</span>
          ${numIn('p4dfMin', f.minPeople, people, '1', err.people)}<span>人以上，</span>
          ${numIn('p4dfPer', f.perPerson, people, '200', err.people)}<span>元/人</span></label>
        <span class="p4d-err${err.people ? ' show' : ''}" style="margin:4px 0 0 28px">請輸入大於或等於 1 的人數與金額</span>
      </div>
      <div>
        <label class="check p4d-inline" data-p4dcond="fixed" style="display:flex"><span class="radio p4-radio"${fixed ? ' data-on' : ''}></span>
          <span class="ck-label">固定金額</span>
          ${numIn('p4dfFix', f.fixed, fixed, '200', err.fixed)}<span>元/組</span></label>
        <span class="p4d-err${err.fixed ? ' show' : ''}" style="margin:4px 0 0 28px">請輸入大於或等於 1 的金額</span>
      </div>
    </div>
    <hr class="p4d-div">
    <div class="btn-row">
      <button class="btn-md ghost" id="p4dfCancel">取消</button>
      <button class="btn-md primary" id="p4dfSave">儲存</button>
    </div>
  </div>`;
}

function p4dRenderList(){
  const box = $('#p4dList'); if (!box) return;
  const F = P4D_FORM;
  const ruleCard = d => `
    <div class="p4d-rule"><div class="m">
      <div class="n">${esc(d.name)}</div>
      <div class="d">${esc(d.desc)}</div>
    </div>
    <button class="p4d-ico" data-p4de="${d.id}" title="編輯">${ICONS.edit}</button>
    <button class="p4d-ico del" data-p4dd="${d.id}" title="刪除">${ICONS.trash}</button></div>`;
  let html = '';
  if (F && F.mode === 'add') html += p4dFormHtml();
  if (DEPOSITS.length){
    html += DEPOSITS.map(d => (F && F.mode === 'edit' && F.id === d.id) ? p4dFormHtml() : ruleCard(d)).join('');
  } else if (!F){
    html += `<div class="p4d-null">尚未設定訂金規則</div>`;
  }
  box.innerHTML = html;
  const cnt = document.querySelector('.p4d-sectitle');
  if (cnt) cnt.textContent = `訂金規則 (${DEPOSITS.length})`;
  document.querySelectorAll('[data-p4de]').forEach(b => b.onclick = () => {
    const d = DEPOSITS.find(x => x.id === b.dataset.p4de); if (!d) return;
    P4D_FORM = { mode: 'edit', id: d.id, orig: JSON.stringify([d.name, d.way, d.cond, d.minPeople, d.perPerson, d.fixed]),
      f: { name: d.name, way: d.way, cond: d.cond, minPeople: d.minPeople, perPerson: d.perPerson, fixed: d.fixed }, err: {} };
    p4dRenderList();
  });
  document.querySelectorAll('[data-p4dd]').forEach(b => b.onclick = () => p4dDelete(DEPOSITS.find(x => x.id === b.dataset.p4dd)));
  if (F) p4dBindForm();
}

function p4dGrab(){
  const f = P4D_FORM.f;
  const v = id => { const el = document.getElementById(id); return el && !el.disabled ? el.value : null; };
  const n = v('p4dfName'); if (n !== null) f.name = n;
  if (f.cond === 'people'){ const a = v('p4dfMin'), b = v('p4dfPer'); if (a !== null) f.minPeople = a; if (b !== null) f.perPerson = b; }
  else { const c = v('p4dfFix'); if (c !== null) f.fixed = c; }
}
function p4dDirty(){
  const F = P4D_FORM;
  if (F.mode === 'add') return true;
  return F.orig !== JSON.stringify([F.f.name, F.f.way, F.f.cond, +F.f.minPeople, +F.f.perPerson, +F.f.fixed]);
}
function p4dSyncSave(){
  const btn = $('#p4dfSave'); if (!btn) return;
  const on = String(P4D_FORM.f.name).trim() !== '' && p4dDirty();
  btn.classList.toggle('primary', on);
  btn.classList.toggle('disabled', !on);
}
function p4dBindForm(){
  p4dSyncSave();
  ['p4dfName', 'p4dfMin', 'p4dfPer', 'p4dfFix'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', () => { p4dGrab(); p4dSyncSave(); });
  });
  document.querySelectorAll('[data-p4dway]').forEach(el => el.onclick = () => {
    p4dGrab(); P4D_FORM.f.way = el.dataset.p4dway; p4dRenderList();
  });
  document.querySelectorAll('[data-p4dcond]').forEach(el => el.onclick = e => {
    if (e.target.tagName === 'INPUT') return;
    p4dGrab(); P4D_FORM.f.cond = el.dataset.p4dcond; p4dRenderList();
  });
  $('#p4dfCancel').onclick = () => { P4D_FORM = null; p4dRenderList(); };
  $('#p4dfSave').onclick = () => {
    if ($('#p4dfSave').classList.contains('disabled')) return;
    p4dGrab();
    const F = P4D_FORM, f = F.f, err = {};
    const name = String(f.name).trim();
    if (DEPOSITS.some(x => x.name.trim() === name && !(F.mode === 'edit' && x.id === F.id))) err.name = '此名稱已被使用';
    const pos = v => /^\d+$/.test(String(v).trim()) && +v >= 1;
    if (f.cond === 'people' && !(pos(f.minPeople) && pos(f.perPerson))) err.people = 1;
    if (f.cond === 'fixed' && !pos(f.fixed)) err.fixed = 1;
    if (Object.keys(err).length){ F.err = err; p4dRenderList(); return; }
    const rec = { name, way: f.way, cond: f.cond, minPeople: +f.minPeople, perPerson: +f.perPerson, fixed: +f.fixed };
    rec.desc = p4dDesc(rec);
    if (F.mode === 'edit'){
      const d = DEPOSITS.find(x => x.id === F.id); Object.assign(d, rec);
      p4dToast('已儲存變更');
    } else {
      let i = DEPOSITS.length + 1; while (DEPOSITS.some(x => x.id === 'd' + i)) i++;
      DEPOSITS.push(Object.assign({ id: 'd' + i }, rec));
      p4dToast('已新增訂金規則');
    }
    P4D_FORM = null; p4dRenderList();
  };
}

function p4dDelete(d){
  if (!d) return;
  openModal(`
    <div class="p4d-modal" style="display:flex;flex-direction:column;gap:16px">
      <h3>確定刪除嗎？</h3>

      </div>
    </div>`);
  $('#p4dDelCancel').onclick = closeModal;

}

        <div class="field-label">群組名稱 <span class="err-msg" id="e_name"></span></div>
        <div class="input${nameDisabled ? ' disabled' : ''}"><input id="i_name" maxlength="12" placeholder="如：室內區" value="${esc(name)}" ${nameDisabled ? 'disabled' : ''}></div>
        ${nameDisabled ? '<div class="hint">此為系統預設群組無法修改名稱</div>' : ''}
      </div>
      <div>
        <label class="check" id="ck_merge">
          <span class="box${merge ? ' on' : ''}" id="bx_merge"></span>
          <span><span class="ck-label">自動合併預約單位</span>
          <div class="ck-desc">當單一預約單位無法容納預約人數時，系統將自動合併單位進行預約安排</div></span>
        </label>
        <div class="sub-field${merge ? ' show' : ''}" id="sf_merge" style="margin-top:10px">
          <span class="sf-label">最多可合併數量</span>
          <div class="input num-input"><input id="i_mergeMax" type="number" min="1" value="${mergeMax}"></div>
          <span class="err-msg" id="e_merge"></span>
        </div>
      </div>
      <div class="btn-row">
        ${isEdit && !isDefault ? '<button class="btn-md ghost-red left" id="delGroupBtn">刪除群組</button>' : ''}
        <button class="btn-md ghost" id="gCancel">取消</button>
        <button class="btn-md primary disabled" id="gSave">儲存</button>
      </div>
    </div>`;
}
function wireGroupForm({ onSave, onCancel, onDelete, nameDisabled = false }) {
  const iName = $('#i_name'), bx = $('#bx_merge'), sf = $('#sf_merge'), iMax = $('#i_mergeMax'), save = $('#gSave');
  const upd = () => save.classList.toggle('disabled', !nameDisabled && !iName.value.trim());
  upd();
  iName && iName.addEventListener('input', () => { $('#f_name').classList.remove('has-error'); $('#e_name').classList.remove('show'); upd(); });
  $('#ck_merge').addEventListener('click', (e) => { e.preventDefault(); bx.classList.toggle('on'); sf.classList.toggle('show', bx.classList.contains('on')); });
  $('#gCancel').addEventListener('click', onCancel);
  const del = $('#delGroupBtn'); del && del.addEventListener('click', onDelete);
  save.addEventListener('click', async () => {
    if (save.classList.contains('disabled')) return;
    const merge = bx.classList.contains('on');
    const mergeMax = parseInt(iMax.value, 10);
    if (merge && (!mergeMax || mergeMax < 1)) { $('#e_merge').textContent = '請輸入大於或等於 1 的數字'; $('#e_merge').classList.add('show'); return; }
    $('#e_merge').classList.remove('show');
    try { await onSave({ name: iName ? iName.value.trim() : '', merge, mergeMax: merge ? mergeMax : 1 }); }
    catch (err) {
      if (err && err.field === 'name') { $('#f_name').classList.add('has-error'); $('#e_name').textContent = err.msg; $('#e_name').classList.add('show'); }
    }
  });
}
function renderGroupForm() {
  addFormOpen = true;
  $('#addGroupSlot').innerHTML = groupFormHtml({ title: '新增群組' });
  wireGroupForm({
    nameDisabled: false,
    onCancel: () => { addFormOpen = false; $('#addGroupSlot').innerHTML = ''; },
    onSave: async (data) => { await api.createGroup(data); addFormOpen = false; toast('已新增群組'); viewUnitList(); },
  });
  $('#i_name').focus();
}

/* =====================================================
   預約單位 — 群組內頁
   ===================================================== */
let addUnitOpen = false;
async function viewGroup(gid) {
  const g = db.groups.find(x => x.id === gid);
  if (!g) { location.hash = '#/unit'; return; }
  const st = groupStats(gid);
  const units = db.units.filter(u => u.gid === gid);
  setTitle([['預約規則', '#/rules'], ['預約單位', '#/unit'], [g.name, '']], '');
  $('#content').innerHTML = `
    <div class="grp-head-card">
      <div class="ghc-main">
        <div class="ghc-name">${esc(g.name)}</div>
        <div class="ghc-sub">可合併單位數：${st.mergeCount} / 總容納人數：${st.capTotal}</div>
      </div>
      <button class="btn-md ghost" id="editGroupBtn">${ICONS.edit} 編輯</button>
    </div>
    <div class="card">
      <div class="sec-head">
        <div class="t">預約單位 (${st.unitCount})</div>
        <button class="btn-md primary" id="addUnitBtn">${ICONS.plus} 預約單位</button>
      </div>
      <div id="addUnitSlot"></div>
      <div class="unit-grid" id="unitGrid">
        ${units.map(u => `
          <div class="u-card" data-u="${u.id}">
            <div class="uc-main">
              <div class="uc-name">${esc(u.name)}</div>
              <div class="uc-cap">${u.min}~${u.max} ${ICONS.person}</div>
            </div>
            <button class="icon-btn" data-edit="${u.id}">${ICONS.edit}</button>
            <button class="icon-btn danger" data-del="${u.id}">${ICONS.trash}</button>
          </div>`).join('') || '<div class="empty">尚未建立預約單位</div>'}
      </div>
    </div>`;
  $('#editGroupBtn').addEventListener('click', () => openEditGroup(gid));
  $('#addUnitBtn').addEventListener('click', () => { if (!addUnitOpen) renderUnitForm(gid); });
  document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEditUnit(b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    await api.deleteUnit(b.dataset.del); toast('已刪除預約單位'); viewGroup(gid);
  }));
  if (addUnitOpen) renderUnitForm(gid);
}

/* 編輯群組 Modal（設計稿：置中 dialog；預設群組名稱鎖定、無刪除鈕） */
function openEditGroup(gid) {
  const g = db.groups.find(x => x.id === gid);
  openModal(`
    <h3>編輯群組</h3>
    ${groupFormHtml({ title: '', name: g.name, nameDisabled: g.isDefault, merge: g.merge, mergeMax: g.mergeMax, isEdit: true, isDefault: g.isDefault })}
  `);
  wireGroupForm({
    nameDisabled: g.isDefault,
    onCancel: closeModal,
    onDelete: () => confirmDeleteGroup(gid),
    onSave: async (data) => { await api.updateGroup(gid, data); closeModal(); toast('已儲存變更'); viewGroup(gid); },
  });
  if (!g.isDefault) { const s = $('#gSave'); s.classList.remove('disabled'); }
  else $('#gSave').classList.remove('disabled');
}
function confirmDeleteGroup(gid) {
  const g = db.groups.find(x => x.id === gid);
  openModal(`
    <h3>確定刪除嗎？</h3>
    <div class="m-body"><p>刪除群組將同時刪除所有預約單位，相關預約需重新配置，否則無法於時間軸與空間配置圖顯示。確定刪除群組「${esc(g.name)}」嗎？</p></div>
    <div class="btn-row">
      <button class="btn-md ghost" onclick="closeModal()">取消</button>
      <button class="btn-md" style="background:var(--alert);color:#fff" id="delConfirm">刪除</button>
    </div>`);
  $('#delConfirm').addEventListener('click', async () => {
    await api.deleteGroup(gid); closeModal(); toast('已刪除群組'); location.hash = '#/unit';
  });
}

/* 新增預約單位 inline 表單 */

function wireUnitForm({ onSave, onCancel }) {
  const iName = $('#i_uname'), iMin = $('#i_umin'), iMax = $('#i_umax'), save = $('#uSave');
  const bxQ = $('#bx_quick'), sfQ = $('#sf_quick');
  const upd = () => save.classList.toggle('disabled', !iName.value.trim() || !iMax.value);
  upd();
  [iName, iMin, iMax].forEach(i => i.addEventListener('input', () => {
    $('#f_uname').classList.remove('has-error'); $('#e_uname').classList.remove('show');
    $('#f_umax').classList.remove('has-error'); $('#e_umax').classList.remove('show');
    upd();
  }));
  const ckQ = $('#ck_quick');
  ckQ && ckQ.addEventListener('click', (e) => { e.preventDefault(); bxQ.classList.toggle('on'); sfQ.classList.toggle('show', bxQ.classList.contains('on')); });
  $('#uCancel').addEventListener('click', onCancel);
  save.addEventListener('click', async () => {
    if (save.classList.contains('disabled')) return;
    const min = parseInt(iMin.value, 10) || 1, max = parseInt(iMax.value, 10);
    if (max < min) { $('#f_umax').classList.add('has-error'); $('#e_umax').textContent = '最多容納人數不得小於最少容納人數'; $('#e_umax').classList.add('show'); return; }
    const qty = (bxQ && bxQ.classList.contains('on')) ? Math.max(2, parseInt(($('#i_qty') || {}).value, 10) || 2) : 1;
    const gid = $('#i_ugid') ? $('#i_ugid').value : null;
    try { await onSave({ name: iName.value.trim(), min, max, qty, gid }); }
    catch (err) {
      if (err && err.field === 'name') { $('#f_uname').classList.add('has-error'); $('#e_uname').textContent = err.msg; $('#e_uname').classList.add('show'); }
    }
  });
}
function renderUnitForm(gid) {
  addUnitOpen = true;
  $('#addUnitSlot').innerHTML = unitFormHtml({ title: '新增預約單位' });
  wireUnitForm({
    onCancel: () => { addUnitOpen = false; $('#addUnitSlot').innerHTML = ''; },
    onSave: async ({ name, min, max, qty }) => {
      const n = await api.createUnits(gid, { name, min, max, qty });
      addUnitOpen = false; toast(n > 1 ? `已新增 ${n} 個預約單位` : '已新增預約單位'); viewGroup(gid);
    },
  });
  $('#i_uname').focus();
}

/* 編輯單位 Modal（含分類群組下拉，可搬群組） */
function openEditUnit(uid) {
  const u = db.units.find(x => x.id === uid);
  openModal(`
    <h3>編輯預約單位</h3>
    ${unitFormHtml({ title: '', name: u.name, min: u.min, max: u.max, showQuick: false, gidSelect: db.groups, curGid: u.gid })}
  `);
  $('#uForm').classList.remove('inline-form');
  $('#uForm .if-title') && ($('#uForm').querySelector('.if-title').style.display = 'none');
  wireUnitForm({
    onCancel: closeModal,
    onSave: async ({ name, min, max, gid }) => {
      const from = u.gid;
      await api.updateUnit(uid, { name, min, max, gid });
      closeModal(); toast('已儲存變更'); viewGroup(from === gid ? gid : from);
    },
  });
